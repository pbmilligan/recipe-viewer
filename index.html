    "text": "Green Chicken Curry\n\nPrep time: 20 minutes\nCook time: 6.25-8.25 hours\nServes: 4\n\nINGREDIENTS\n- Cooking Temperature: low and high\n\n- 1 tablespoon sunﬂower oil\n- 2 tablespoons Thai green curry paste\n- 2 teaspoons galangal paste\n- 2 Thai green chillies, deseeded and thinly sliced\n- 1 onion, ﬁnely chopped\n- 8 chicken thighs, about 1 kg in total, skinned, boned and cubed\n- 400 ml full-fat coconut milk\n- 150 ml chicken stock\n- 4 dried kafﬁr lime leaves\n- 2 teaspoons light muscovado sugar\n- 2 teaspoons Thai ﬁsh sauce (nam pla)\n- 100 g  sugar snap peas\n- 100 g green beans, halved\n- small bunch of coriander, to gamish\n- rice, to serve\n\nMETHOD\n1. Preheat the slow cooker if necessary; see the manufacturer’s handbook. Heat the oil in a frying pan, add the curry paste, galangal paste and green chillies and cook for 1 minute.\n2. Stir in the onion and chicken and cook, stirring, until the chicken is just beginning to turn golden. Pour in the coconut milk and stock, then add the lime leaves, sugar and ﬁsh sauce. Bring to the boil, stirring.\n3. Transfer the mixture to the slow cooker pot, cover with the lid and cook on low for 6-8 hours or until the chicken is tender.\n4. Stir in the peas and beans and cook on high for 15 minutes or until they are just tender. Tear the coriander leaves over the top, spoon into bowls and serve with rice.\n\nNOTES\nThai curry paste and ﬁsh sauce are now widely available in all of the larger supermarkets. Galangal paste is sold in small jars and has a gingery taste, while dried kafﬁr lime leaves can also be found in jars in the same aisle.\n\nSOURCE\nThe Complete Slow Cooker by Sara Lewis, p 168\n"

    "title": "Sally’s Bolognaise Sauce",
    "category": "Savoury",
    "filename": "Sally's Bolognaise Sauce.txt",
    "text": "Sally’s Bolognaise Sauce\n\nServes: 4\n\nINGREDIENTS\n- Vegetable oil\n- 1 onion\n- 1 large carrot\n- 2 cloves garlic\n- 1 tin chopped tomatoes\n- 1 tbsp tomato purée\n- 450g minced beef\n- 2 tsp dried oregano\n- Splash Worcestershire sauce\n\nMETHOD\n1. Heat oil and fry onions and carrots for 5-10 minutes, until softened.\n2. Tip onto a plate and then fry the mince until browned; add the Worcestershire sauce and garlic for the last couple of minutes.\n3. Re-add the onions and carrots and add the chopped tomatoes, tomato purée and oregano.\n4. Bring to the boil and then leave to simmer for at least 30 minutes. Use a lid as appropriate.\n5. Serve with pasta.\n\nSOURCE\nSally (Paul added the carrots and Worcestershire sauce)\n\n\nFor 10:\n3 onion\n3 large carrot\n5 cloves garlic\n2-3 tin chopped tomatoes\n3 tbsp tomato purée\n1250g minced beef\n5 tsp dried oregano\nSplash Worcestershire sauce\n"

  {
    "title": "Saucy lentil gnocchi ragù",
    "category": "Savoury",
    "filename": "Saucy lentil gnocchi ragu.txt",
    "text": "Saucy lentil gnocchi ragù\n\nServes: 4\nPrep time: Less than 30 minutes\nCook time: 10-30 minutes\n\nINGREDIENTS\n- 1 tbsp olive oil\n- 1 tsp paprika\n- 1 tsp dried oregano\n- 0.5 tsp dried red chilli flakes (optional)\n- 5 garlic cloves, blended or finely chopped\n- 1 onion, blended or finely chopped\n- 2 celery sticks, blended or finely chopped\n- 250g/8oz chestnut mushrooms, blended or\n- finely chopped\n- 2 carrots, peeled and blended or finely chopped\n- 2 tbsp tomato purée\n- 3 tbsp dark soy sauce\n- 400g tin chopped tomatoes\n- 1 vegetable stock cube\n- 400g tin green lentils, drained\n- 1 tsp sugar\n- 2 x 400g packets fresh gnocchi\n- salt and freshly ground black pepper\n- fresh basil leaves, sliced, to garnish\n- hard cheese, finely grated, to serve (optional)\n\nMETHOD\n1. Heat the oil in a large saucepan. Stir in the paprika, oregano and chilli flakes and fry for 1 minute to infuse the spices.\n2. Add the garlic, onion and celery and cook for a few minutes until softened. Add the mushrooms and cook for 5 minutes to draw out their moisture. Add the carrots and cook for a further 2 minutes.\n3. Mix in the tomato purée and soy sauce.\n4. Pour in the tomatoes. Refill the empty tomato tin with boiling water and the stock cube, stir until dissolved and then pour the stock into the pan. Add the lentils and sugar and mix everything together.\n5. Simmer for around 15 minutes, stirring occasionally, or until it begins to thicken but still remains saucy. Season generously with salt and pepper.\n6. Add the gnocchi directly into the sauce, stir through and cook for a few minutes until soft and ready to eat.\n7. Serve in bowls and garnish with a handful of the basil. Serve with a good sprinkling of the cheese, if using.\n\nNOTES\nBlending the vegetables in a food processor not only saves a lot of time but it adds to the saucy texture. However, if you do not have a food processor, chopping everything finely will work just as well.\nDon’t faff with pre-cooking the gnocchi – this is a great one-pot recipe where the gnocchi cooks in the sauce.\n\nSOURCE\nBBC Food https://www.bbc.co.uk/food/recipes/saucy_lentil_gnocchi_rag_84948\n"

  {
    "title": "Sausage and sweet potato frittata",
    "category": "Savoury",
    "filename": "Sausage and sweet potato frittata.txt",
    "text": "Sausage and sweet potato frittata\n\nServes: 4\n\nINGREDIENTS\n- 2tbsp olive oil\n- 454g pack Finest British pork sausages\n- 1 sweet potato (about 225g/8oz) peeled and thinly sliced\n- 1 medium red onion, cut into thin wedges\n- 50g (2oz) baby spinach leaves, roughly sliced\n- 8 large eggs\n- 1tbsp snipped chives, plus extra to garnish\n- green salad, to serve\n\nMETHOD\n1) Heat 1 tablespoon of the oil in a large non-stick frying pan with a heatproof handle. Add the sausages (no need to prick them) and fry over a medium heat for 10-12 minutes, turning occasionally until evenly browned. Remove, drain on kitchen paper and allow to cool slightly before cutting each one into 5 diagonal slices.\n2) Wipe out the pan, then pour in the remaining 1 tablespoon of oil and heat up. Tip in the the sweet potato and red onion and stir fry for 10-12 minutes until softened and turning golden. Stir in the spinach for a few seconds (just enough to wilt) then return the sausages to the pan. Preheat the grill to high.\n3) Beat the eggs, season, pour them into the pan, then scatter over with the snipped chives. Cook over a medium heat for about 5 minutes, or until the edges begin to set. Place the pan under the grill for a few more minutes until the top begins to puff up and is lightly browned. Scatter over the remaining snipped chives, and serve with a green salad.\n\nNOTES\n\nWe forgot the spinach!\n\"COOK'S TIP: This frittata is good served cold as well as warm - and great for taking on a picnic.\"\n\nSOURCE\nTesco web site (http://www.tescorealfood.com/Recipes/Sausage-sweet-potato-and-red-onion-frittata.html)\n"

    "title": "Shepherd's Pie",
    "category": "Savoury",
    "filename": "Shepherds Pie.txt",
    "text": "Shepherd's Pie\n\nServes: 3-4\n\nINGREDIENTS\n- 25g butter\n- 1 large onion (120g), peeled and chopped\n- 2 carrots, peeled and chopped\n- 1tbsp flour\n- 300ml Beef Stock\n- 1tbsp tomato puree\n- Worcester sauce\n- 0.5tsp mixed dry herbs\n- Salt and pepper\n- 450g minced lamb\n- 600g potatoes, cut into 1cm slices\n- Butter and milk\n\nMETHOD\nadd 120g red or brown lentils, cooked according to the packet\n1. Peel and boil the potatoes for 20 minutes until they soften.\n2. Meanwhile, fry the minced lamb and put aside.\n3. Meanwhile, cook the lentils. To cook red lentils on the hob, use 300ml water for 120g of dry lentils, bring the pot to a boil, and then simmer gently for 10 to 15 minutes until tender.\n4. Melt the butter and fry the onion and carrots until brown. Stir in the flour and cook for 1 minute. Gradually stir in the stock and bring to the boil, stirring constantly.\n5. Preheat the oven to 180degC.\n6. Add the lentils, tomato puree, Worcester sauce, herbs and seasoning. Cover the pan, reduce the heat and simmer for 15 minutes. Mash the potatoes with the butter and milk.\n7. Remove from the heat and add the minced meat, mix well and turn into an ovenproof dish. Allow to cool a little before covering with the mashed potato.\n8. Transfer the dish to the oven and heat for 10-20 minutes, until the potatoes is starting to crisp.\n\nNOTES\nAdd 120g lentils to make it serve 4\nThe pan is hot when you remove it from the oven!!!\n\nSOURCE\nSally's recipe folder\n"

    "title": "Slow cooker pulled pork",
    "category": "Savoury",
    "filename": "Slow cooker pulled pork.txt",
    "text": "Slow cooker pulled pork\n\nServes: 8 - 10\n\nINGREDIENTS\n- Preparation and cooking time\n- Prep:5 mins\n\n- 2kg pork shoulder, skin removed\n- 1 onion, sliced\n- 2 tsp smoked paprika\n- ½ tsp cinnamon\n- 1 tbsp flour\n- 2 tsp oil\n\nFor slow cooking:\n\n- 4 garlic cloves, crushed\n- 160ml cloudy apple juice\n- 1 tbsp black treacle\n- 2 tbsp honey\n- 3 tbsp apple cider vinegar\n- 50g onion marmalade\n\nTo serve:\n\n- 1 fennel bulb, sliced thinly\n- 1 apple, sliced thinly\n- juice 1 lemon\n- 8 - 10 bread rolls\n- English mustard\n- mayonnaise (optional)\n\nMETHOD\nCook:8 hrs and 5 mins Easy Succulent pulled pork spiced with paprika and cinnamon is oh-so simple when you make it in the slow cooker. Serve with fennel and apple slices in bread rolls\n1. Put the onion slices at the bottom of the slow cooker. In a small bowl mix together 1 tbsp salt with 1 tsp ground black pepper, the smoked paprika and cinnamon. Put the flour onto a plate then rub the spice mixture over the pork.\n2. Heat the oil in a large frying pan and roll the spiced pork in the flour before putting it into the pan to sear it on all sides. Once the meat is starting to pick up a golden colour pop it on top of the onion slices in the slow cooker.\n3. In a large jug combine all the ingredients for slow cooking the pork then pour over the meat. Pop the lid on and cook on the low setting for 8 hours.\n4. When you’re ready to serve, take the meat out of the slow cooker leaving the cooking liquor behind. Put the cooked meat on a roasting tray or large shallow bowl and pull it into bite-size chunks and shred with 2 forks. Ladle a little of the cooking juices over the pork and mix together.\n5. Toss the fennel and apple slices in the lemon juice and season well then serve along with the pulled pork in bread rolls. Spread the rolls with a little English mustard and mayonnaise if you like.\n\nNOTES\nwe did it with mash not rolls\n\nSOURCE\nhttps://www.bbcgoodfood.com/recipes/slow-cooker-pulled-pork\n"

    "text": "Chicken and Roasted Pepper Soup\n\nServes: 6\n\nINGREDIENTS\n- 12 red peppers\n- Sea salt and freshly ground black pepper\n- 10 chicken thighs, skin on\n- 2 tbsp olive oil\n- 1 onion, chopped\n- 2 garlic cloves, crushed\n- 1.5 litres / 2.5 pints warm chicken stock\n- Handful of fresh basil leaves, roughly torn\n- Handful of fresh mint leaves, roughly chopped\n- 2 tsp fresh marjoram, chopped\n- Duchese oil or good quality extra virgin olive oil\n\nMETHOD\n1. Preheat the oven to 200ûC / 400ûF / Gas 6. Roast the peppers whole for 25 mins, then leave to cool. Scrape out the seeds and slice the peppers thinly.\n2. Meanwhile, season the chicken thighs with salt and pepper and roast alongside the peppers for 20 mins, or until cooked. Cool briefly, then discard the skin and bones and shred the meat finely.\n3. Heat the 2 tbsp oil in a large saucepan, add the onion and cook until golden. Add the strips of pepper and the garlic.\n4. Add the stock to the pan, along with the chicken and herbs. Season to taste and simmer for 5 mins, then ladle into warmed soup bowls and serve with olive oil drizzled on top.\n\nSOURCE\nShe magazine\n"

  {
    "title": "Thai Coconut Curry Butternut Squash Soup",
    "category": "Savoury/Soup",
    "filename": "Thai Coconut Curry Butternut Squash Soup.txt",
    "text": "Thai Coconut Curry Butternut Squash Soup\n\nServes: 4\n\nINGREDIENTS\n- 1 tablespoon vegetable oil (if cooking on hob)\n- 2 cloves garlic, minced\n- 1 small yellow onion, diced\n- 1 teaspoon ginger, freshly grated\n- 2 tablespoons Thai red curry paste\n- 2 cups chicken or vegetable broth\n- 1 medium-sized butternut squash, peeled, seeded, and cut into 1 inch cubes (about 4 cups)\n- 1 (15-ounce) can coconut milk, divided\n- Juice of 1 lime\n- 1/2 teaspoon salt, plus more to taste\n- 1/4 teaspoon freshly ground pepper, plus more to taste\n- Sriracha to taste, optional\n- 1/3 cup cilantro, chopped, to garnish\n- 1/3 cup unsalted, dry-roasted peanuts, chopped, to garnish\n- Naan, to serve, optional\n\n- Hob Method\n\nMETHOD\n1. Heat the oil in a large soup pot over medium heat.\n2. Add in the garlic and onion, and saute until soft and fragrant, about 3 minutes.\n3. Add in the ginger and curry paste and stir to combine with the onion and garlic. Cook for 3 more minutes, stirring often.\n4. Add in the raw butternut squash cubes and slowly pour in the broth, stirring to combine. Season with salt and pepper.\n5. Bring to a boil and then reduce heat to a simmer and cover.\n6. Cook for 20 minutes, or until butternut squash is tender. Remove from heat and let cool for a few minutes.\n7. Pour the soup into a blender in batches and blend until smooth, or use an immersion blender to blend in the pot or slow cooker.\n8. Before serving, remove the soup from the heat and mix in the coconut milk (saving a few tablespoons to garnish) and lime juice (if using). Mix well.\n9. Season with additional salt and pepper, if desired, and add sriracha to taste for extra spice, if using.\n10. Pour into bowls and drizzle the remaining coconut milk on top. Swirl the coconut milk with a spoon. Sprinkle with chopped cilantro and chopped peanuts. Serve warm with naan bread. Slow Cooker Method\n1. Add butternut squash, garlic, onion, ginger, Thai curry paste, broth, and salt and pepper to the slow cooker. Stir to evenly distribute. Cover and cook on low for 6-8 hours, or high for 3-4 hours.\n2. Pour the soup into a blender in batches and blend until smooth, or use an immersion blender to blend in the pot or slow cooker.\n3. Before serving, turn off the slow cooker and mix in the coconut milk (saving a few tablespoons to garnish) and lime juice (if using). Mix well.\n4. Season with additional salt and pepper, if desired, and add sriracha to taste for extra spice, if using.\n5. Pour into bowls and drizzle the remaining coconut milk on top. Swirl the coconut milk with a spoon. Sprinkle with chopped cilantro and chopped peanuts. Serve warm with naan bread.\n\nSOURCE\nhttps://hostthetoast.com/thai-coconut-curry-butternut-squash-soup/\n"

  {
    "title": "Spaghetti alla Carbonara",
    "category": "Savoury",
    "filename": "Spaghetti alla Carbonara.txt",
    "text": "Spaghetti alla Carbonara\n\nServes: 4\n\nINGREDIENTS\n- 30ml/2tbsp Oil\n- 1 Onion, chopped\n- 1 Garlic clove, crushed\n- 25g/1oz Butter or margarine\n- 175g/6oz Bacon, rinded and chopped\n- 90ml/6tbsp Dry white wine\n- 350g/12oz Spaghetti\n- 3 Eggs\n- 75g/3oz Parmesan cheese, grated\n- 15ml/1tbsp Chopped parsley\n- Salt and pepper\n\nMETHOD\n1. Heat the oil and fry the onion and garlic until soft but not browned. Add the butter and bacon and fry until crisp. Add the wine, bring to the boil and simmer until the wine has evaporated. Meanwhile, cook the spaghetti in boiling salted water until just tender, then drain and rinse in hot water. Beat the eggs with the cheese and parsley and season to taste with salt and pepper. Toss the spaghetti with the egg mixture, then mix in the bacon mixture. The heat from the spaghetti will be sufficient to cook the eggs. Serve immediately.\n\nNOTES\n\nUsed tagliatelle instead of spaghetti (20/9/2003)\n\nSOURCE\nThe Classic 1000 Recipes, Wendy Hobson (p.186)\n"

    "filename": "Spanish eggs with chorizo \u0026 peppers.txt",
    "text": "Spanish eggs with chorizo \u0026 peppers\n\nServes: 4\n\nINGREDIENTS\n- 500g baby new potato\n- 2 onions, sliced\n- 2 red peppers, deseeded and cut into strips\n- 200g cooking chorizo, sliced\n- 4 eggs\n\nMETHOD\n1. Steam the potatoes for 15-20 mins or until cooked.\n2. Heat 1 tbsp oil in a non-stick pan. Add the onions and peppers, then cook for about 10 mins until soft. Push the peppers to the side of the pan and add the chorizo, sizzling until cooked though and releasing its oils. Transfer to a plate.\n3. Once cool enough, halve the potatoes. Heat 1 tbsp oil in another non-stick pan and tip in the spuds. Fry for about 10 mins until golden and beginning to crisp. Stir in the onion mix, heat through and season.\n4. Meanwhile, in the onion pan, fry the eggs to your liking. Place them on top of everything, allowing 1 egg per person.\n\nNOTES\nAdded 4 celery stick cut into 1cm pieces at the same time as the onions and pepper\n\nSOURCE\nhttps://www.bbcgoodfood.com/recipe/spanish-eggs-chorizo-peppers\n"

    "text": "Spiced Cauliflower\n\nServes: 8\n\nINGREDIENTS\n- 5 tbsp vegetable oil\n- 5g ginger, finely chopped\n- 1.6 tsp chilli flakes (used 0.25 for 200g cauliflower)\n- 1.6 tbsp cumin seed (used 0.5 for 200g cauliflower)\n- 1.6 tsp turmeric (used 0.5 for 200g cauliflower)\n- 1kg (after trimming and removing leaves) cauliflower\n- , broken into pieces\n\nMETHOD\n1. Heat the oil in a big pan or wok with a lid, then add the ginger and spices. Swirl everything around for a few secs until the spices are aromatic. Reduce the heat, then stir in the cauliflower and some seasoning. Put the lid on and cook for 10 mins or until softened, stirring occasionally.\n2. https://www.bbcgoodfood.com/recipes/1713636/spicy-cauliflower\n"

  {
    "title": "Spicy Spinach and Carrot Muffins",
    "category": "Savoury",
    "filename": "Spicy Spinach and Carrot Muffins.txt",
    "text": "Spicy Spinach and Carrot Muffins\n\nINGREDIENTS\n- Makes 9 muffins\n\n- 200ml semi-skimmed milk\n- 25g butter\n- 100g spinach\n- 250g plain flour\n- 1tbsp baking powder\n- 1tsp bicarbonate of soda\n- 2 medium carrots, coarsely grated\n- good pinch of crushed dried chillies\n- good pinch of black pepper\n- 50g fresh Parmesan, finely grated\n- 75g savoury seeds mix\n- 1 egg, lightly beaten\n\nMETHOD\n1. Preheat the oven to Gas 5, 190degC, fan 170degC. Grease and line 9 holes of a deep muffin tin with squares of baking parchment, or use muffin cases to line them.\n2. Place the milk and butter in a large pan over a high heat. When the butter has melted, stir in the spinach and bring just to the boil. Remove from the heat and pour into a liquidizer. Whizz until the spinach is finely chopped. Allow to cool for 10 minutes.\n3. Sift the flour, baking powder and bicarbonate of soda into a large bowl. Add the grated carrot, chillies, and season. Stir in most of the Parmesan and seeds, reserving a tablespoon of each. Add the egg to the spinach mixture, then beat with a wooden spoon until just mixed. Divide between 9 muffin holes, and sprinkle with the reserved Parmesan and seeds.\n4. Back for 20-25 minutes, until risen and firm to the touch. Leave to cool for 5 minutes, then turn out onto a wire rack. Serve hot or cold.\n\nNOTES\n\nWe used habanero dried chillies, which were probably too hot!\n\nSOURCE\nTesco magazine\n"

    "filename": "Sticky Pan-Roasted Sausages with Grapes.txt",
    "text": "Roasted Sausages with Grapes\n\nServes: 4\n\nINGREDIENTS\n- 1tbsp Olive Oil\n- 450g Pork Sausages\n- 2 onions, sliced\n- 1 garlic clove, sliced\n- 1tsp Fennel seeds\n- 100g South African grapes\n- 2tbsp red wine vinegar\n\nMETHOD\n1. Heat the olive oil in a frying pan over a medium heat, add the sausages and cook for 10 minutes, turning every so often\n2. Stir in the onions and leave to cook for 5 more minutes until the sausages are browned and the onions are softened\n3. Add the garlic, fennel seeds and grapes and cook for 5 more minutes, stirring regularly, until the grapes are starting to soften.\n4. Pour over the vinegar and swirl around the pan\n5. Cook for a few more minutes until the onions are sticky and the sausages cooked throughout\n6. Ideal served with mashed potatoes\n\nNOTES\n\nWe did serve it with mash, but we used white wine vinegar and non-South African grapes (gasp!)\n\nSOURCE\nSouth African Grapes Recipe Booklet\n"

    "filename": "Sweet and Sour Chicken.txt",
    "text": "Sweet and Sour Chicken\n\nServes: 4\nServe: d with rice. We also added 2 carrots at the same time as the pineapple chunks.\n\nINGREDIENTS\n- 25g/1oz margarine or butter\n- 1 red pepper, seeded and cut into chunks\n- 1 bunch spring onions, chopped\n- 4 tbsp soft dark brown sugar\n- 2 tsp cornflour\n- 1 chicken stock cube\n- 350g/12oz can pineapple chunks, drained and syrup reserved\n- 2 tbsp wine vinegar\n- 2 tbsp soy sauce\n- salt (optional)\n- 225-350g/8-12oz cooked chicken, cut into chunks\n\nMETHOD\n1. Heat the margarine or butter in a saucepan, add the red pepper and chopped spring onions and fry gently for 3-4 minutes until the vegetables are soft but not browned. Put the soft dark brown sugar, cornflour and chicken stock cube into a measuring jug and slowly stir in boiling water up to the 300ml/0.5pt mark. Continue stirring until the ingredients have dissolved. Add the reserved pineapple syrup, vinegar and soy sauce. Season to taste with salt. Pour this liquid into the pan with the red pepper and spring onions and bring to the boil. Lower the heat and simmer the mixture for about 2 minutes, stirring. Add the chicken and pineapple chunks and continue to simmer the curry over gentle heat for about 10 minutes. Serve hot.\n\nSOURCE\nNice and Simple One-Pot Cooking (p.28)\n"

    "text": "Sweet and Sour Pork Chops (slow cooker)\n\nServes: 4\n\nINGREDIENTS\n- 1tbsp plain flour\n- Salt and pepper\n- 4 lean pork chops, trimmed of excess fat\n- 2tbsp oil\n- 2 onions, finely chopped\n- 90ml vegetable stock\n- 60ml soy sauce\n- 4tbsp tomato puree\n- 4tbsp soft brown sugar\n- 60ml dry sherry\n- Plain rice, to serve\n\nMETHOD\n1. 1 Season the flour with salt and pepper, then dust the chops with the flour, shaking off any excess. 2 Heat the oil in a frying pan and brown the chops quickly on all sides. Transfer to the slow cooker. 3 Add the onions to the pan and cook for about five minutes, stirring occasionally, until beginning to turn golden brown. Stir in the remaining ingredients and bring just to the boil. Pour over the chops in the slow cooker. 4 Cover and cook on LOW for 5-8 hours.\n\nNOTES\nDoubled up the quantities.\n\nSOURCE\nNew Recipes For Your Slo-Cooker by Annette Yates, p88\n"

    "title": "Sweet Chilli Chicken Drumsticks",
    "category": "Savoury",
    "filename": "Sweet Chilli Chicken Drumsticks.txt",
    "text": "Sweet Chilli Chicken Drumsticks\n\nServes: 12\n\nINGREDIENTS\n- 1 tablespoon honey\n- 5 tablespoons sweet chilli sauce\n- 3 tablespoons soy sauce\n- 12 chicken drumsticks, skin removed\n\n- Preparation method\n\n- Prep: 10 mins | Cook: 20 mins\n\nMETHOD\n1. In a large bowl, mix together the honey, sweet chilli sauce and soy sauce. Set aside a small dish of the marinade for basting. Place chicken drumsticks into the bowl. Cover and refrigerate at least 1 hour.\n2. Preheat barbecue for medium high heat.\n3. Lightly oil the barbecue cooking grate. Arrange drumsticks on the grate and cook for 10 minutes per side, or until cooked through. Baste frequently with the reserved sauce during the last 5 minutes.\n4. Or oven - 45 min?\n\nSOURCE\nallrecipes.co.uk\nhttp://allrecipes.co.uk/recipe/2361/sweet-chilli-chicken-drumsticks.aspx\n"
  },
  {
    "title": "Sweet potato \u0026 pepper tikka masala, butter beans \u0026 garlic yogurt",
    "category": "Savoury",
    "filename": "Sweet potato \u0026 pepper tikka masala.txt",
    "text": "Sweet potato \u0026 pepper tikka masala, butter beans \u0026 garlic yogurt\n\nServes: 4\n\nINGREDIENTS\n- 2 sweet potatoes (500g)\n- 2 peppers (any colour)\n- 2 red onions\n- 1 clove of garlic\n- 1/2 a bunch of fresh coriander (15g)\n- vegetable oil\n- 2 heaped tbsp tikka paste\n- 400g tin plum tomatoes 400g tin butter beans\n- 4 tbsp natural yogurt\n- 1/2 a lemon\n\nMETHOD\n1. Preheat the oven to gas 4, 180°C, fan 160°C. Scrub the sweet potatoes. deseed the peppers and cut it all into 3cm chunks. Peel and quarter the onions, then break into petals. Peel the garlic clove. then ﬁnely slice half.\n2. Place the veg in a large dry casserole pan on a high heat and cook for 5 mins so it starts to char.\n3. Pick the coriander leaves and put aside, then ﬁnely slice the stalks. Stir into the pan with 1 tbsp oil and the sliced garlic, and cook for 5 mins more, or until the veg is nicely charred, stirring regularly.\n4. Stir through the tikka paste for 2 mins, then tip in the tomatoes, plus 1 tin's worth of water. Add the butter beans (juice and all), then transfer to the oven for 45 mins, or until the liquid has reduced and the sauce has thickened.\n5. Meanwhile, ﬁnely grate the remaining garlic into the yogurt. Squeeze in the lemon juice, mix well and season to perfection.\n6. Ripple the yogurt through the sauce, then roughly chop the coriander leaves and scatter them over the curry. Delicious served with rice and poppadoms.\n\nNOTES\nTakes 1 hr. Cost per serve 84p\n\nSOURCE\nTesco Magazine, February 2020\n"
  },

  {
    "title": "Tartiflette (Potato Gratin)",
    "category": "Savoury",
    "filename": "Tartiflette (Potato Gratin).txt",
    "text": "Tartiflette (Potato Gratin)\n\nServes\n\nINGREDIENTS\n- 2 lb 12 oz / 1.25 kg medium Desiree potatoes, peeled and sliced 0.5 inch / 1 cm thick\n- 2 tbsp vegetable oil\n- 12 slices streaky bacon, cut into chunks\n- 2 large onions, peeled and finely slicked\n- salt, pepper and fresh nutmeg\n- 8 fl oz / 200 ml dry white wine\n- 10.5 oz / 300g creme fraiche\n- 1 large or 2 small Reblochon cheese\n\nMETHOD\n1. Heat the oven to 200ûC / 400ûF / Gas 6. Simmer the potatoes in salted water until soft. Strain into a colander and leave to cool a little.\n2. While potatoes are cooking, heat a large shallow pan with the vegetable oil and fry the bacon for 3 mins until the fat starts to run. Add the onion, cover and sweat for about 10 mins, stirring occasionally until soft. Turn up the heat and cook, stirring constantly for 5 mins or until golden, then drain on absorbent paper.\n3. Cover the bottom of a gratin dish with half of the potatoes and season with salt, pepper and nutmeg. Spread the onion and bacon mixture over the top and follow with the second half of the potatoes. Pour in the white winaeand spread over the creme fraiche.\n4. Slice the Reblochon in half widthways then slice each half through the centre. Place the four pieces of cheese, crust side up, over the top. Bake for 30 mins or until golden.\n\nNOTES\nCan substitute Camembert if can't find Reblochon.\n\nSOURCE\nNewspaper\n"
  },
  {
    "title": "Thai Green Beef Curry",
    "category": "Savoury",
    "filename": "Thai Green Beef Curry.txt",
    "text": "Thai Green Beef Curry\n\nServes: 4\n\nINGREDIENTS\nBeef:\n- 600g best lean beef fillet, cut into strips\n- 500ml coconut milk\n- 1 red chilli, deseeded and chopped\n- 4cm fresh root ginger, grated\n- 3 kaffir lime leaves\n- 2 tbsp Thai fish sauce\n- 1 tbsp brown sugar\n- 3 tbsp sesame oil, to fry\nCurry Paste:\n- 1 fresh green chilli\n- 20g fresh coriander\n- 1 onion, diced\n- 1 tbsp sesame oil\n- 0.5 tsp ground turmeric\n- 0.5 tsp shrimp paste\n- 1 garlic clove, crushed\n- 1 lemon grass stalk, roughly chopped\n- 0.5 tsp ground cumin\n- 0.5 tsp caraway seeds\n\nMETHOD\n1. To make the green curry paste, blend all the ingredients in a food processor to form a smooth paste. Heat the oil in a wok and cook this paste for 1 minute.\n2. Add the beef strips to the paste and stir-fry for 1 minute. Add the coconut milk, chilli, ginger, kaffir lime leaves, fish sauce and brown sugar. Bring to the boil, stirring all the time. Cook for 8 minutes. Serve with white rice or noodles.\n\nNOTES\n\nCouldn't find the shrimp paste\n\nSOURCE\nVitality Cookbook by Susan Clark, p. 82.\n"

  {
    "title": "Tuscan Sausage Stew",
    "category": "Savoury",
    "filename": "Tuscan Sausage Stew.txt",
    "text": "Tuscan Sausage Stew\n\nTakes: 1hour   Serves: 4\n\nINGREDIENTS\n- 1tbsp olive oil\n- 6 sausages\n- 1 medium onion, chopped\n- 1 large carrot, chopped\n- 1 celery stick, chopped\n- 1 medium red pepper, chopped\n- 1 organic chicken stock cube\n- 2 x 400g tinned chopped tomatoes\n- 400g cannellini beans, drained and rinsed\n- 1tbsp tomato puree\n- 1 bay leaf\n- 1tsp dried oregano\n- 1tbsp pesto\n\nMETHOD\n1. Pre-heat the oven to Gas 6, 200°C, fan 180°. Heat the oil in a casserole dish and brown the sausages for 5 minutes.\n2. Add the onion, carrot, celery and pepper to soften. Add a little more oil if you need to and cook for 10 minutes.\n3. Dissolve the stock cube in a mug (small!) of boiling water and add to the pot with the tinned tomatoes, cannellini beans, tomato puree, bay leaf and oregano. Bring to a simmer.\n4. Cook in the oven with the lid on for 30-40 minutes. Stir in the pesto and serve immediately.\n\nSOURCE\nTesco\n"

    "title": "Vegetable Curry",
    "category": "Savoury",
    "filename": "Vegetable Curry.txt",
    "text": "Vegetable Curry\n\nServes: 4\n\nINGREDIENTS\n- 45ml/3tbsp Oil\n- 2 Onions, sliced\n- 5ml/1tsp Chilli powder\n- 5ml/1tsp Coriander\n- 25g/1oz Root ginger, grated\n- 2 Aubergines, sliced\n- 175g/6oz Mixed Beans\n- 100g/4oz Potatoes, cubed\n- 225g/8oz Canned tomatoes, chopped\n\nMETHOD\n1. Heat the oil and fry the onions until just browned. Add the chilli powder, coriander and ginger and fry for 2 minutes. Add the aubergines, peas and potatoes and fry for 5 minutes. Stir in the tomatoes and season to taste with salt and pepper. Bring to the boil. cover and simmer for 30 minutes until the vegetables are tender.\n\nNOTES\n\nOriginal recipe had peas instead of mixed beans\n\nSOURCE\nThe Classic 1000 Recipes, Wendy Hobson (p.206)\n"

  {
    "title": "brownies",
    "category": "Sweet",
    "filename": "brownies.txt",
    "text": "http://www.jamieoliver.com/recipes/chocolate-recipes/bloomin-brilliant-brownies\n\nINGREDIENTS\n- 250g unsalted butter\n- 200g dark Fairtrade chocolate (70% cocoa solids), broken up\n- optional: 75g dried sour cherries\n- optional: 50g chopped nuts\n- 80g cocoa powder, sifted\n- 65g plain flour, sifted\n- 1 teaspoon baking powder\n- 360g caster sugar\n- 4 large free-range or organic eggs\n- optional: zest of 1 orange\n- optional: 250ml crème fraîche\n\nMETHOD\n1. This great little recipe is taken from my Little Book Of Big Treats which I've put together exclusively for Comic Relief. All you have to do is bake a few of these and sell them to your friends, family, colleagues or schoolmates and you'll have raised an extra few quid for Comic Relief and their brilliant causes. What could be easier?\n2. Preheat your oven to 180°C/350°F/gas 4. Line a 25cm square baking tin with greaseproof paper. In a large bowl over some simmering water, melt the butter and the chocolate and mix until smooth. Add the cherries and nuts, if you’re using them, and stir together. In a separate bowl, mix together the cocoa powder, flour, baking powder and sugar, then add this to the chocolate, cherry and nut mixture. Stir together well. Beat the eggs and mix in until you have a silky consistency.\n3. Pour your brownie mix into the baking tray, and place in the oven for around 25 minutes. You don’t want to overcook them so, unlike cakes, you don’t want a skewer to come out all clean. The brownies should be slightly springy on the outside but still gooey in the middle. Allow to cool in the tray, then carefully transfer to a large chopping board and cut into chunky squares. These make a fantastic dessert served with a dollop of crème fraîche mixed with some orange zest.\n4. • from Jamie's Little Book of Big Treats\n"
  },
  {
    "title": "Chewy Chocolate Chip Cookies",
    "category": "Sweet",
    "filename": "Chewy choc chip cookies.txt",
    "text": "Chewy Chocolate Chip Cookies\n\nINGREDIENTS\n- 100g/4oz softened butter/margarine\n- 100g/4oz soft brown sugar\n- 1 tbsp golden syrup or honey\n- 150g/6oz self raising flour\n- 1/2 tsp vanilla extract (optional)\n- 50g/2oz chocolate chips or Smarties\n\nMETHOD\n1. Preheat the oven to 170°C/160°C fan/Gas 3.\n2. Beat the butter, sugar and syrup together until soft and creamy. Mix in the flour, vanilla extract and add the chocolate chips. Divide the mixture into about 15 pieces and roll into balls using your hands. Place well apart on greased baking sheets. Do not flatten them.\n3. Bake for about 10 mins until a pale golden colour (don't cook any longer or they'll go crispy!)\n4. Leave to cool on the tray for a few minutes and then remove from the tray and finish cooling on a wire rack.\n5. Suitable for freezing\n6. Sent in by Karen Variations:\n7. * Use any combination of raisins, chopped glace cherries, dates, dried apricots, nuts etc instead of chocolate chips if preferred. * For double chocolate cookies, replace 2 tbsp of the flour with 2 tbsp cocoa. * Use dairy-free marg and choc chips for vegan/dairy-free cookies.\n\nSOURCE\nwww.netmums.com\n"
  },
  {
    "title": "Chocolate Almond Crunchies",
    "category": "Sweet",
    "filename": "Chocolate Almond Crunchies.txt",
    "text": "Chocolate Almond Crunchies\n\nINGREDIENTS\n- Makes 18 cookies\n\n- 2 oz (50 g) dark Continental chocolate (75 per cent cocoa solids)\n- 1.5 oz (40 g) whole almonds, unblanched\n- 4 oz (110 g) butter\n- 3 oz (75 g) demerara sugar\n- 1 dessertspoon golden syrup\n- 4 oz (110 g) self-raising flour\n- pinch of salt\n- 4 oz (110 g) porridge oats\n\nMETHOD\n1. Pre-heat the oven to gas mark 3, 325¡F (170¡C).\n2. You will also need two baking sheets measuring 14 x 11 inches (35 x 28 cm), lightly greased with groundnut or another flavourless oil.\n3. First of all, using a sharp knife, chop the chocolate into small chunks about 0.25 inch (5 mm) square. Now put the butter, sugar and syrup in a saucepan, place it on the gentlest heat possible and let it all dissolve, which will take 2-3 minutes. Meanwhile, chop the nuts into small chunks about the same size as the chocolate pieces. When the butter mixture has dissolved, take it off the heat. In a large mixing bowl, sift in the flour and salt and add the porridge oats and half the chocolate and nuts, then give this a quick mix before pouring in the butter mixture. Now, using a wooden spoon, stir and mix everything together, then switch from a spoon to your hands to bring everything together to form a dough. If it seems a bit dry, add a few drops of cold water.\n4. Now take half the dough and divide it into nine lumps the size of a large walnut, then roll them into rounds using the flat of your hand. Place them on a worktop and press gently to flatten them out into rounds approximately 2.5 inches (6 cm) in diameter, then scatter half the remaining chocolate and almonds on top of the biscuits, pressing them down lightly. Once you have filled one tray (give them enough room to spread out during baking), bake them on the middle shelf of the oven for 15 minutes while you prepare the second tray. When they're all cooked, leave them to cool on the baking sheets for 10 minutes, then transfer them to a wire rack to finish cooling. You could store the biscuits in a sealed container, but I doubt you'll have any left!\n\nNOTES\nNone\n\nSOURCE\nDelia Online (also How to Cook Book One)\n"
  },
  {
    "title": "Chocolate cookies with scarlet fruit",
    "category": "Sweet",
    "filename": "Chocolate cookies with scarlet fruit.txt",
    "text": "Chocolate cookies with scarlet fruit\n\nINGREDIENTS\n- 200g/7oz dark chocolate at least 70% cocoa solids\n- 75g/3oz butter\n- 225g/8oz light muscovado sugar\n- 2 free-range eggs\n- vanilla extract\n- 50g/2oz skinned hazelnuts\n- 150g/5¼oz self-raising flour\n- handful of fresh cherries and raspberries, to serve\n\nMETHOD\n1. Preheat the oven to 180C/350F/Gas 4. Snap the chocolate into pieces in a small heatproof glass bowl. Place the bowl over a small pan of simmering water, with the base of the bowl not quite touching the water. Allow the chocolate to melt. Don't be tempted to stir it, other than to occasionally push any unmelted chocolate down into the liquid chocolate to encourage it to melt. Turn off the heat as soon as the chocolate has melted.\n2. Cream the butter and sugar together in a food processor until smooth and creamy. Break the eggs and vanilla extract in a small bowl or jug, whisk just enough to break up the eggs, then add the mixture gradually to the butter and sugar, beating constantly. It is worth scraping down the sides of the bowl with a rubber spatula from time to time to ensure a thorough mixing. Add the melted chocolate and continue to mix.\n3. Toast the hazelnuts in a shallow pan until golden, shaking regularly so they colour evenly. Grind the nuts coarsely using a pestle and mortar to the texture of gravel, then remove half and continue grinding the other half until it resembles fine breadcrumbs. Add the flour and both textures of nut to the cookie mixture. Stop beating as soon as everything is combined.\n4. Place large, heaped tablespoons of the mixture on to a baking tray lined with baking parchment. You should get twelve large biscuits. The mixture is fine to sit for a few minutes if you are cooking them in two batches. Don't be tempted to flatten the cookies, they will do so in the oven anyway.\n5. Bake the cookies for 10-12 minutes. The cookies will have spread and be very soft to the touch. Remove them from the oven and set aside to cool a little. As soon as they are cool enough to move without breaking, slide a palette knife underneath and carefully lift them onto a cooling rack. Serve with a handful of cherries and raspberries.\n\nSOURCE\nhttp://www.bbc.co.uk/food/recipes/chocolate_cookies_with_95245\n"
  },
  {
    "title": "Chocolate Guinness Cake",
    "category": "Sweet",
    "filename": "Chocolate Guinness Cake.txt",
    "text": "Chocolate Guinness Cake\n\nServes: ?\n\nINGREDIENTS\nCake:\n- 4 oz margarine\n- 10 oz dark soft brown sugar\n- 2 medium eggs, beater\n- 6 oz plain flour\n- 1/4 tsp baking powder\n- a level tsp bicarbonate of soda\n- 7 fl oz Guinness\n- 2 oz cocoa\nIcing:\n- 4 oz plain chocolate\n- 2 tbsp Guinness\n- 2 oz butter\n- 4 oz icing sugar, sifted\n- 1 oz walnuts, finely chopped\n\nCake:\n\nMETHOD\n1. Grease and line two 8 inch sandwich tins, and preheat the oven to gas 4 / 180û C.\n2. Cream butter and sugar together. Gradually beat in the eggs.\n3. Sift the flour, baking powder and bicarbonate of soda into a separate bowl.\n4. Stir Guinness into cocoa. Carefully fold in alternate quantities of flour and coca to butter/sugar mixture.\n5. Spread mixture into tins and bake for 30-35 minutes. Leave to cool in tins for 5 mins before turning out. Icing:\n1. Melt chocolate with Guinness, then beat in butter and leave to cool a little before blending in icing sugar.\n2. Remove 1/4 of icing and stir in chopped walnuts. When icing has cooled to spreading consistency, sandwich cake with walnut icing and use rest for top and sides.\n3. Decorate with walnut halves and grated chocolate.\n\nNOTES\nNot tried yet\n\nSOURCE\nDelia Smith's Book of Cakes\n"
  },

    "text": "Crumble\n\nServes: ??\n\nINGREDIENTS\nFor the crumble topping:\n- 150g plain flour\n- 75g caster sugar\n- 75g unsalted butter at room temperature, cut into pieces\n- scatter with sugar on top once in dish\n\nFor apple crumble filling:\n- 450g/1lb apples, peeled, cored and cut into 1cm/½in pieces\n- 50g/2oz unrefined brown sugar\n- 1 tbsp plain flour\n- 1 pinch of ground cinnamon\n\nFor rhubarb crumble filling:\n\nMETHOD\n1. roast the rhubarb: https://www.bbcgoodfood.com/recipes/roasted-rhubarb 550g rhubarb 80g caster sugar Roast 180C 15-20 min covered in a single layer and covered in foil\n2. Nice with blueberries added after roasting but before baking crumble Bake crumble 20 min\n"

  {
    "title": "Cupcakes",
    "category": "Sweet",
    "filename": "Cupcakes.txt",
    "text": "Cupcakes\n\nINGREDIENTS\nCupcakes:\n\n- 100g/4 oz softened unsalted butter\n- 100g/4 oz self raising flour\n- 100g/4 oz caster sugar\n- 2 eggs\n\nCream cheese frosting:\n\n- 300g icing sugar\n- 50g softened unsalted butter\n- 125g cream cheese\n\n- Makes 12 cupcakes\n\n- Turn on the oven to Gas 4/180 C/170C fan.\n\nMETHOD\n1. In a large bowl, whisk all the ingredients until creamy. Spoon into individual cupcake cases and cook for about 10 - 15 minutes until cooked.\n2. To check they are cooked just press gently and they should spring back.\n3. Once cooled, the cakes can be decorated with cream cheese frosting (or icing) and then decorated.\n4. To make the frosting, put the icing sugar and butter in a bowl. Using an electric whisk, beat together until well mixed.\n5. Add all the cream cheese to the mixture and using the whisk mix all together until the frosting is light \u0026 fluffy. Be careful not to overmix or it can quickly become runny.\n6. Spread onto the cupcakes with a flat knife or pipe on using a piping bag. To change the colour of the frosting, simple add a drop or two of food colouring.\n7. Chocolate cupcakes: To make chocolate cupcakes, replace 25g of flour with cocoa powder.\n\nSOURCE\nnetmums.com\n"
  },
  {
    "title": "Easter lemon pavlova",
    "category": "Sweet",
    "filename": "Easter Lemon Pavlova.txt",
    "text": "Easter lemon pavlova\n\nPrep time: 30 mins to 1 hour\nCook time: over 2 hours\nServes: 6-8\n\nINGREDIENTS\n- by Mary Berry\n\nFor the meringue:\n- 6 free-range egg whites\n- 350g/12oz caster sugar\n- 2 tsp white wine vinegar\n- 2 level tsp cornflour\nFor the lemon curd filling:\n- 6 free-range egg yolks\n- 350g/12oz caster sugar\n- 4 lemons, juice only\n- 225g/8oz butter\n- 450ml/¾pint double cream\nTo serve:\n- 30 chocolate mini-eggs\nFor the candied lemon zest:\n- 100g/3½oz caster sugar, plus extra for coating the zest\n- 4 lemons, zest only (in long thin strips)\n\nMETHOD\n1. Preheat the oven to 160C/325F/Gas 3. Lay a piece of baking paper on a baking tray and draw a 25cm/10in circle on it.\n2. Put the egg whites into a bowl and whisk on the fastest speed with an electric hand-whisk or in a free-standing mixer until stiff. Gradually, still whisking on maximum speed, add generous teaspoons of sugar until the mixture is stiff and shiny and stands in peaks.\n3. Blend the vinegar and cornflour together in a cup and mix until smooth. Stir this into the meringue mixture.\n4. Spread half of the meringue mixture onto the paper to give a 25cm/10in circle. Fill a piping bag, fitted with a rose nozzle, with the rest of the meringue mixture. Carefully pipe about 10 separate little nests positioned equally around the edge of the circle.\n5. Slide the meringue into the middle of the oven, turn the heat down to 150C/300F/Gas 2 and bake for 1½-2 hours (check after one hour), or until it easily comes off the paper. The pavlova will be a pale creamy colour rather than white. Turn off the oven and leave the pavlova in the oven to become cold.\n6. Meanwhile, make the lemon curd for the filling. Place a heatproof bowl over a pan of hot water, simmering gently on the stove. Add the egg yolks, sugar and lemon juice to the bowl and whisk. Gradually add the butter, whisking continually until it starts to thicken. It should coat the back of a spoon when it reaches the correct consistency. It will firm up further once cooled.\n7. Whisk the double cream in a large bowl until thickened, then swirl it through the cooled lemon curd.\n8. Spoon the lemon curd and cream mixture into the middle of the pavlova and spread over the base of the meringue nest. Spoon a lemon filling into each of the mini nests. Decorate by placing three chocolate mini-eggs in each of the 10 mini-nests around the edge of the dessert.\n9. Put 100ml/3½fl oz water and the caster sugar in a pan. Bring to the boil, stirring. Add the zest and boil for 2-3 minutes, or until syrupy. Drain on parchment paper, roll in extra caster sugar and leave to dry in a warm place for a couple of hours, or overnight. Place a delicate mound of candied zest in the middle of the pavlova, and serve.\n\nSOURCE\nhttp://www.bbc.co.uk/food/recipes/easter_lemon_pavlova_99601\n"
  },
  {
    "title": "Easy-Peasy Banana Muffins",
    "category": "Sweet",
    "filename": "Easy-Peasy Banana Muffins.txt",
    "text": "Easy-Peasy Banana Muffins\n\nINGREDIENTS\n- 20-30 mins. Servings 12\n\n- 125g salted butter\n- 150g caster sugar\n- 190g self-raising flour\n- 1 egg, beaten\n- 3 ripe bananas, mashed\n- 60ml milk\n- Large handful of chocolate chunks\n\nMETHOD\n1. Preheat the oven to 170C/150C fan and line a muffin tin with cake cases.\n2. Melt together the sugar and butter in a saucepan, then remove from the heat and add the banana and egg. Mix well.\n3. Add the flour to the wet mixture, then add the milk. Stir until well combined.\n4. Transfer the mixture to a measuring jug to make it easier to pour into the cases, then fill each one up about two-thirds of the way, leaving room for the cakes to rise.\n5. Press some chocolate chunks into the centre of each cake.\n6. Bake for around 12-15 minutes, or until the cakes turn golden brown and a cocktail stick inserted into the middle comes out clean (except for any melted chocolate!)\n7. Transfer to a cooling rack or enjoy warm from the oven.\n\nSOURCE\nhttps://www.lovefoodhatewaste.com/recipe/easy-peasy-banana-muffins\n"
  },
  {
    "title": "Florentines",
    "category": "Sweet",
    "filename": "Florentines.txt",
    "text": "Florentines\n\nINGREDIENTS\n- 2oz butter\n- 2oz golden syrup\n- 2oz Demerara sugar\n- 20z chopped nuts\n- 2oz chopped glace cherries\n- 2oz candied peel\n- 6oz dark chocolate\n\nMETHOD\n1. In a saucepan gently melt the butter, demerara sugar and golden syrup. Remove from the heat.\n2. Next stir in the chopped nuts, chopped glacé cherries and candied peel. Add 2 oz plain flour to the mixture and stir well. Spoon teaspoonfuls of the mixture onto lined baking sheets.\n3. Space them well apart as they will spread a lot.\n4. Cook for 8 – 10 minutes at 180\n5. Remove from oven and leave to harden.\n6. Melt the chocolate over a pan of hot water and spread on reverse of Florentines.\n7. Leave to cool and for the chocolate to harden.\n8. Eat!\n9. (Best stored in fridge if they last that long!)\n10. (It was suggested that chopped preserved ginger could be used instead of or in addition to the glace cherries or nuts but we haven’t tried that – yet!)\n"
  },

  {
    "title": "Ginger biscuits",
    "category": "Sweet",
    "filename": "Ginger biscuits.txt",
    "text": "Ginger biscuits\n\nINGREDIENTS\n- makes about 12 biscuits\n\n- 4oz plain flour\n- 1/2 teaspoon baking powder\n- 2oz granulated sugar\n- 1/2 teaspoon bicarb of soda\n- 1 teaspoon ground ginger\n- 2oz Marge or butter\n- 2oz golden syrup\n\nMETHOD\n1. With exception of golden syrup, mix all above ingredients into breadcrumbs.\n2. Add the 2oz golden syrup to mixture and mix using a spoon, mix into a dough.\n3. Take generous teaspoons of the mixture and hand roll into balls.\n4. Place on baking tray lined with grease proof paper.\n5. Bake for 11 mins in preheated oven, 180°C in fan or gas oven or 200°C in a conventional oven.\n6. Once cooked leave to stand on tray for 5 mins where they will harden.\n"

    "title": "Grandma’s Raspberry Jam",
    "category": "Sweet",
    "filename": "Grandma's Raspberry Jam.txt",
    "text": "Grandma’s Raspberry Jam\n\nTake: jam jar?\n\nINGREDIENTS\n- Or for recipe with jam sugar see https://www.bakingmad.com/recipes/raspberry-jam\n\nMakes 10lb of jam (10 x 454g jars):\n- 4lb /1.8kg raspberries\n- 5 1/2lb / 2.5kg granulated sugar\n- 1 bottle Certo (if making smaller quantity, a bottle is use within 14 days)\n\nMETHOD\n1. Put the berries in  a pan with the sugar and crush (I use my potato masher).  I use homegrown raspberries which are probably riper and juicier than supermarket ones and crush easily.\n2. Heat gently, stirring occasionally until the sugar has dissolved\n3. Bring quickly to a full rolling boil and boil rapidly for 2 minutes stirring occasionally to stop it burning on the bottom of the pan\n4. Remove from the heat and stir in the Certo\n5. This recipe is for raspberry jam complete with pips so I sieve it by putting a metal sieve over a bowl and pouring the jam through using a spoon to push through the flesh Then pour into sterilized jam jars using a jam funnel\n6. To sterilise jars wash and put in oven on 120 degrees for about 20 minutes (do this while making the jam)\n"

    "title": "Highland Flummery",
    "category": "Sweet",
    "filename": "Highland Flummery.txt",
    "text": "Highland Flummery\n\nServes: ?\n\nINGREDIENTS\n- 3 tablespoons of whisky\n- 1 tablespoon of lemon juice\n- 2 tablespoons of clear honey\n- Half a pint (300 ml) double cream\n- Medium oatmeal or digestive biscuits\n\nMETHOD\n1. Blend the whisky, lemon juice and honey together to thin the honey. Add the double cream and whisk until thick and light. Spoon into individual serving glasses. If you have whisked it really well the mixture should mound softly in each glass. Chill for several hours. Sprinkle with oatmeal or crushed digestives.\n\nSOURCE\nRay Burns\n"

  {
    "title": "Banana Fudge Chunk Ice Cream",
    "category": "Sweet/Ice Cream",
    "filename": "Banana Fudge Chunk Ice Cream.txt",
    "text": "Banana Fudge Chunk Ice Cream\n\nINGREDIENTS\n- Makes generous 1 quart\n\n- Sweet Cream Base 3 (2 cups whipping cream; 1 cup condensed milk)\n- 2 overripe bananas\n- Juice of 1 lemon\n- 1 cup cold coarsely chopped chocolate fudge\n\nMETHOD\n1. Prepare the Sweet Cream Base. Transfer the mixture to an ice cream maker and freeze following the manufacturer's instructions.\n2. Mash the bananas and lemon juice together in a bowl, then whisk until smooth.\n3. Stir fudge into the banana mixture.\n3. After the ice cream stiffens (about 2 minutes before it is done), add the banana mixture, then continue freezing until the ice cream is ready.\n\nNOTES\n\nUsed six fingers of Fudge\n\nSOURCE\nBen \u0026 Jerry's Homemade Ice Cream \u0026 Dessert Book, Ben Cohen \u0026 Jerry Greenfield with Nancy J. Stevens (p.52)\n"

  {
    "title": "Banana Peanut Butter Ice Cream",
    "category": "Sweet/Ice Cream",
    "filename": "Banana Peanut Butter Ice Cream.txt",
    "text": "Banana Peanut Butter Ice Cream\n\nINGREDIENTS\n- Makes generous 1 quart\n\n- Sweet Cream Base 1\n- 0.5 cup smooth peanut butter\n- 2 overripe bananas\n- Juice of 1 lemon\n\nMETHOD\n1. Prepare the Sweet Cream Base. Pour about 1 cup of the cream base into a separate bowl and stir in the peanut butter, a little at a time. Return to the remaining cream base and stir until completely blended. Transfer the mixture to an ice cream maker and freeze following the manufacturer's instructions. Mash the bananas in a bowl, add the lemon juice, and whisk until smooth. After the ice cream stiffens (about 2 minutes before it is done), add the banana mixture, then continue freezing until the ice cream is ready.\n\nNOTES\n\nHalved quantities\n\nSOURCE\nBen \u0026 Jerry's Homemade Ice Cream \u0026 Dessert Book, Ben Cohen \u0026 Jerry Greenfield with Nancy J. Stevens (p.63)\n"

  {
    "title": "Ben's Chocolate Ice Cream",
    "category": "Sweet/Ice Cream",
    "filename": "Ben's Chocolate Ice Cream.txt",
    "text": "Ben's Chocolate Ice Cream\n\nINGREDIENTS\n- Makes 1 quart\n\n- 4oz unsweetened chocolate\n- 1 cup milk\n- 2 large eggs\n- 1 cup sugar\n- 1 cup heavy or whipping cream\n- 1 tsp vanilla extract\n- 1 pinch salt\n\nMETHOD\n1. Melt the unsweetened chocolate in the top of a double boiler over hot, not boiling water. Gradually whisk in the milk and heat, stirring continuously, until smooth. Remove from the heat and let cool. Whisk the eggs in a mixing bowl until light and fluffy, 1 to 2 minutes. Whisk in the sugar, a little at a time, then continue whisking until completely blended, about 1 minute more. Add the cream, vanilla and salt and whisk to blend. Pour the chocolate mixture into the cream mixture and blend. Cover and refrigerate until cold, about 1 to 3 hours, depending on your refrigerator. Transfer the mixture to an ice cream maker and freeze following the manufacturer's instructions.\n\nNOTES\n\nUsed Lindt 85% chocolate\n\nSOURCE\nBen \u0026 Jerry's Homemade Ice Cream \u0026 Dessert Book, Ben Cohen \u0026 Jerry Greenfield with Nancy J. Stevens (p.44)\n"

  {
    "title": "Dime Bar Ice Cream",
    "category": "Sweet/Ice Cream",
    "filename": "Dime Bar Ice Cream.txt",
    "text": "Dime Bar Ice Cream\n\nINGREDIENTS\n- Makes generous 1 quart\n\n- 4 Dime bars\n- 2 large eggs\n- 0.75 cup sugar\n- 2 cups double or whipping cream\n- 1 cup milk\n- 2 tsp vanilla extract\n\nMETHOD\n1. Using a sharp knife, cut the candy bars into .5 to 1 inch chunks. You should have about 1 cup. Place the chunks in a bowl, cover, and freeze.\n2. Whisk the eggs in a mixing bowl until light and fluffy, 1 to 2 minutes. Whisk in the sugar, a little at a time, then continue whisking until completely blended, about 1 minute more. Pour in the cream, milk, vanilla extract, and whisk to blend.\n3. Transfer the mixture to an ice cream maker and freeze following the manufacturer's instructions.\n4. After the ice cream stiffens (about 2 minutes before it is done), add the candy, then continue freezing until the ice cream is ready.\n\nNOTES\n\nHalved quantities. This is known as Heath Bar Crunch Ice Cream in the Ben \u0026 Jerry's book\n\nSOURCE\nBen \u0026 Jerry's Homemade Ice Cream \u0026 Dessert Book, Ben Cohen \u0026 Jerry Greenfield with Nancy J. Stevens (p.32)\n"

  {
    "title": "Lemon Curd Ice Cream",
    "category": "Sweet/Ice Cream",
    "filename": "Lemon Curd Ice Cream.txt",
    "text": "Lemon Curd Ice Cream\n\nServes: 6\n\nINGREDIENTS\n- 4 egg yolks\n- 180g caster sugar\n- 40g butter, cut into bits\n- Zest of 1 lemon\n- Juice of 2 lemons\n- 250ml milk\n- 375ml single cream\n\nMETHOD\n1. Bring a pan half-full of water to the boil and then lower the heat to the absolute minimum.\n2. Put the egg yolks and sugar in a wide glass or stainless steel bowl and whisk until they are thick and creamy.\n3. Sit the bowl on top of the pan of water, add the butter and let it melt. Whisk until it starts to get thicker and creamier.\n4. Add the lemon zest and juice and carry on whisking until it thickens.\n5. Meanwhile, warm up the milk a little. Whisk it into the lemony eggs and then remove the bowl from the heat.\n6. Whisk from time to time until it's cool before you whisk in the cream.\n7. Put the bowl in the fridge until it's cool and then transfer the mixture to an ice cream maker and freeze following the manufacturer's instructions.\n\nNOTES\n25 minutes in ice cream maker.\n\nSOURCE\nDaily Mail (Weekend magazine), May or June 2006\n"

    "text": "Liquorice Ice Cream\n\nServes: 6\n\nINGREDIENTS\n- 150g liquorice\n- 1 cup milk\n- 300ml whipping cream\n- 2 tbsp sugar\n- 4 egg yolks\n\nMETHOD\n1. Combine liquorice, milk and cream in medium saucepan. Stir over medium heat without boiling, until liquorice has dissolved. Bring just to the boil and remove from the heat. Beat sugar and egg yolks in a small bowl with electric mixer until thick and creamy. Beat hot milk mixture gradually into egg yolk mixture. Cool. Freeze in ice cream maker according to manufacturers instructions.\n\nNOTES\n\nIt's a pain to get the liquorice to dissolve in the hot milk\n\nSOURCE\nepicurean.com\n"

  {
    "title": "White Chocolate Ice Cream",
    "category": "Sweet/Ice Cream",
    "filename": "White Chocolate Ice Cream.txt",
    "text": "White Chocolate Ice Cream\n\nServes: 6\n\nINGREDIENTS\n- 0.5 litre milk\n- 75ml sugar\n- 5 egg yolks\n- 200g white chocolate, melted on a bain-marie\n- 1oz milk powder\n- 100ml double cream\n\n- Cream together the egg yolks and the sugar until white and stiff.\n\nMETHOD\n1. In a saucepan combine the milk, milk powder and cream and bring to the boil. Pour some of the milk onto the creamed eggs and sugar, whisking continuously. Return the mixture to the saucepan and over a medium heat cook out to 80C/175F. Pass through a sieve and then pour in the melted white chocolate. Allow to cool. Turn in an ice cream machine. Remove and place into the freezer.\n\nNOTES\n\nAdded almond flakes\n\nSOURCE\nBBC Food web site\n"

  {
    "title": "Clementine Jelly",
    "category": "Sweet/Jelly",
    "filename": "Clementine Jelly.txt",
    "text": "Clementine Jelly\n\nServes: 6\n\nINGREDIENTS\n- 2 gelatine sachets (23g in total, see comments)\n- 800ml clementine juice\n- White sugar (to taste)\n- Small piece of fresh Ginger, peeled\n- 2 fresh clementines, peeled and sliced into thin rounds\n- 1 big teaspoon of vanilla syrup or a few drops of vanilla extract\n- 200g plain yoghurt\n- Good-quality dark chocolate\n\nMETHOD\n1. Pour the clementine juice into a pan on a high heat to warm through: don't let it boil. Add a little sugar to sweeten: not too much, you still want that zippy clementine flavour. Grate in a tiny bit of ginger, then grate a bit more onto a chopping board then squeeze it over the pan of juice so you get a few drips of ginger juice in there. Take the juice off the heat. Sprinkle gelatine over the juice, then whisk in quickly.\n2. Arrange 6 small serving glasses on a tray and put 2 clementine rounds in each. Sieve the juice mix into each glass, allow to cool, then refrigerate for about 3 hours, or until set.\n3.  To serve, mix the vanilla syrup into the yoghurt and dollop a spoonful on top of each jelly, then grate or shave a few pretty bits of chocolate on top.\n\nNOTES\nThe amount of gelatine you'll need will vary depending on the type you use, so check packet instructions and adjust accordingly. Buy vanilla syrup at good supermarkets and delis.\n\nSOURCE\nRadio Times, 20-26 November 2010; Christmas recipe supplement. The recipe first appeared in Jamie Magazine\n"
  },
  {
    "title": "Rhubarb and Ginger Jelly",
    "category": "Sweet/Jelly",
    "filename": "Rhubarb and Ginger Jelly.txt",
    "text": "Rhubarb and Ginger Jelly\n\nServes: 4\nPrep time: 10 mins\nCook time: 6 hours\n\nINGREDIENTS\n- 400 g fresh rhubarb\n- 40 g (1½oz) caster sugar\n- 20 g (1oz) fresh root ginger, peeled and grated\n- 250 ml Finest Apple and Elderflower Cordial\n- 10 leaves gelatine\n\nMETHOD\n1. Wash and trim the rhubarb, then cut into 2.5cm (1in) pieces. Put in a heavy bottomed pan with the sugar and grated ginger.\n2. In a jug, mix the cordial with 750ml (1¼ pints) of water. Add 50ml of this mixture to the rhubarb, then stew over a medium heat with a lid on for 5-8mins.\n3. When the rhubarb is cooked add the rest of the cordial and bring it to the boil.\n4. Put the gelatine leaves into a bowl of cold water for 4mins to soften.\n5. Take the rhubarb mixture off the heat. Remove the gelatine from the water, squeeze out any excess liquid, and add the gelatine to the mixture. Stir thoroughly for 1min until the gelatine has melted.\n6. Cool, then ladle into four glasses. Put into the fridge to set for 4-6hours, then serve.\n"
  },
  {
    "title": "LIQUORICE ROCKY ROAD",
    "category": "Sweet",
    "filename": "Liquorice Rocky Road.txt",
    "text": "LIQUORICE ROCKY ROAD\n\nINGREDIENTS\n- 500g white chocolate\n- 200g vanilla and strawberry marshmallows, roughly chopped\n- 150g almonds, roasted and coarsely chopped\n- 20g Lakeland Freeze-Dried Strawberry Pieces, plus extra for scattering\n- 200g Red Soft Eating Liquorice, chopped into small pieces\n- 200g Black Soft Eating Liquorice, chopped into small pieces\n\nMETHOD\n1. Grease and line the pan with baking paper, allowing the sides to overhang for easy removal.\n2. Melt the chocolate in a heatproof bowl over a pan of simmering water, stirring occasionally for about 2-3 minutes until smooth.\n3. Combine the remaining ingredients in a bowl, pour over the chocolate and stir to coat well.\n4. Spread the mixture evenly into the pan, scatter over the extra strawberry pieces and set aside for about 2 hours until firm.\n5. Turn out onto a clean surface and cut into chunks.\n\nNOTES\nTip: Can be stored in an airtight container for up to 2 weeks.\n\nMade using the My Kitchen Loose-based 20cm sq bakepan\n\nSOURCE\nhttp://www.lakeland.co.uk/r80771/Liquorice-Rocky-Road\n"

    "title": "Maple Syrup and Walnut Bread",

    "filename": "Maple Syrup and Walnut Bread.txt",
    "text": "Maple Syrup and Walnut Bread\n\nINGREDIENTS\n- 1 cup water, tepid\n- 1 tbsp dried skimmed milk\n- 1 tsp salt\n- 6 tbsp maple syrup at room temperature\n- 2 cups wholewheat bread flour\n- 1 cup white bread flour\n- 1 tsp yeast\n- 3 ounces walnuts, roughly chopped\n\nMETHOD\n1. Place the ingredients in the order given in your bread machine's instructions.\n2. Add the walnuts when your machine beeps which is usually after the first five minutes when you add items like raisins.\n"

  {
    "title": "Ultimate meringue",
    "category": "Sweet",
    "filename": "Meringue.txt",
    "text": "Ultimate meringue\n\nServes: 16\n\nINGREDIENTS\n- 4 large organic egg whites , at room temperature\n- 115g caster sugar\n- 115g icing sugar\n\nMETHOD\n1. Preheat the oven to fan 100C/ conventional 110C/gas 1?4. Line 2 baking sheets with Bake-O-Glide non-stick liner or parchment paper (meringue can stick on greaseproof paper and foil).\n2. Tip the egg whites into a large clean mixing bowl (not plastic). Beat them on medium speed with an electric hand whisk until the mixture resembles a fluffy cloud and stands up in stiff peaks when the blades are lifted.\n3. Now turn the speed up and start to add the caster sugar, a dessertspoonful at a time. Continue beating for 3-4 seconds between each addition. It's important to add the sugar slowly at this stage as it helps prevent the meringue from weeping later. However, don't over-beat. When ready, the mixture should be thick and glossy.\n4. Sift a third of the icing sugar over the mixture, then gently fold it in with a big metal spoon or rubber spatula. Continue to sift and fold in the icing sugar a third at a time. Again, don't over-mix. The mixture should now look smooth and billowy, almost like a snow drift.\n5. Scoop up a heaped dessertspoonful of the mixture. Using another dessertspoon, ease it on to the baking sheet to make an oval shape (pic 3). Or just drop them in rough rounds, if you prefer. Bake for 1 1?2-1 3?4 hours in a fan oven, 1 1?4 hours in a conventional or gas oven, until the meringues sound crisp when tapped underneath and are a pale coffee colour. Leave to cool on the trays or a cooling rack. (The meringues will now keep in an airtight tin for up to 2 weeks, or frozen for a month.) Serve two meringues sandwiched together with a generous dollop of softly whipped double cream.\n\nSOURCE\nBBC Good Food\n"
  },
  {
    "title": "Ultimate meringue recipe",
    "category": "Sweet",
    "filename": "Meringues.txt",
    "text": "Ultimate meringue recipe\n\nINGREDIENTS\n- 4 large organic egg whites , at room temperature\n- 115g caster sugar\n- 115g icing sugar\n\nMETHOD\n1. Preheat the oven to fan 100C/ conventional 110C/gas 1/4. Line 2 baking sheets with Bake-O-Glide non-stick liner or parchment paper (meringue can stick on greaseproof paper and foil).\n2. Tip the 4 large egg whites into a large clean mixing bowl (not plastic). Beat them on medium speed with an electric hand whisk until the mixture resembles a fluffy cloud and stands up in stiff peaks when the blades are lifted.\n3. Now turn the speed up and start to add 115g caster sugar, a dessertspoonful at a time. Continue beating for 3-4 seconds between each addition. It's important to add the sugar slowly at this stage as it helps prevent the meringue from weeping later. However, don't over-beat. When ready, the mixture should be thick and glossy.\n4. Sift one third of the 115g icing sugar over the mixture, then gently fold it in with a big metal spoon or rubber spatula. Continue to sift and fold in the remaining icing sugar a third at a time. Again, don't over-mix. The mixture should now look smooth and billowy, almost like a snow drift.\n5. Scoop up a heaped dessertspoonful of the mixture. Using another dessertspoon, ease it on to the baking sheet to make an oval shape (pic 3). Or just drop them in rough rounds, if you prefer. Bake for 1 1/2-1 3/4 hours in a fan oven, 1 1/4 hours in a conventional or gas oven, until the meringues sound crisp when tapped underneath and are a pale coffee colour. Leave to cool on the trays or a cooling rack. (The meringues will now keep in an airtight tin for up to 2 weeks, or frozen for a month.) Serve two meringues sandwiched together with a generous dollop of softly whipped double cream.\n\nSOURCE\nhttp://www.bbcgoodfood.com\n"
  },
  {
    "title": "Serves: Makes approx. 24",
    "category": "Sweet",
    "filename": "Nigella's Xmas Chocolate Biscuits.txt",
    "text": "Serves: Makes approx. 24\n\nINGREDIENTS\n- 250g soft butter\n- 150g caster sugar\n- 40g cocoa powder\n- 300g plain flour\n- ½ teaspoon bicarbonate of soda\n- 1 teaspoon baking powder\nFOR THE FESTIVE TOPPING:\n- 2 x 15ml tablespoons cocoa powder\n- 175g icing sugar\n- 60ml boiling water, from a kettle\n- 1 teaspoon vanilla extract\n- Christmas sprinkles\n\nMETHOD\n1. Preheat the oven to 170°C/gas mark 3 and line a baking sheet with Bake-O-Glide or baking parchment. Cream the butter and sugar in a bowl and, when you have a light, soft, whipped mixture, beat in the 40g cocoa powder (sieving if it is lumpy) and, when that’s mixed in, beat in the flour with the bicarb and baking powder. Or just put everything in the processor and blitz, if you prefer. This mixture is very soft and sticky and I find it easiest to form the biscuits wearing my CSI (disposable vinyl) gloves, so pinch off pieces about the size of a large walnut, roll them into balls, then slightly flatten into fat discs as you place them, well spaced, on your baking sheet; you should get about 12 on at a time. Bake each batch for 15 minutes; even though the biscuits won’t feel as if they’ve had enough time, they will continue to cook as they cool. They will look slightly cracked on top, and it’s this cosy, homespun look I love. Remove the baking sheet to a cold surface and let it sit for 15 minutes before transferring the biscuits to a wire rack, with a sheet of newspaper under it (to catch drips while topping them). To make the topping, put the cocoa powder, icing sugar, water and vanilla extract into a small saucepan and whisk over a low heat until everything’s smoothly combined. Take off the heat for 10 minutes. When the biscuits are cool, drizzle each one with a tablespoonful of chocolate glaze – to glue the sprinkles on in a minute – using the back of the spoon to help spread the mixture, though an uneven dribbly look is part of their charm. After you’ve iced 6 biscuits, scatter with some of the Christmas sprinkles, and continue thus until all the biscuits are topped. If you ice them all before sprinkling, you will find the cocoa “glue” has dried and the sprinkles won’t stick on.\n2. MAKE AHEAD TIP:\n3. Bake the biscuits up to 5 days ahead. Cool and store in an airtight container between sheets of parchment paper.\n4. FREEZE AHEAD TIP:\n5. Freeze the cooled biscuits in sealable bags or rigid containers for up to 3 months. Thaw at room temperature.\n\nSOURCE\nhttp://www.nigella.com/recipes/view/christmas-chocolate-biscuits\n"
  },
  {
    "title": "Orange And Almond Cake",
    "category": "Sweet",
    "filename": "Orange And Almond Cake.txt",
    "text": "Orange And Almond Cake\n\nServes: 6\n\nINGREDIENTS\n- 2 large oranges\n- 6 eggs\n- 250g ground almonds\n- 250g golden caster sugar\n- 1 level tsp baking powder\n\nMETHOD\n1. Wash and boil the whole, unpeeled oranges in a moderate amount of water for two hours, or until they are very tender. Drain and cool them. Then remove the pips and blitz the fruit to a pulp. If you do not have a food processor, you could push the oranges through a sieve.\n2. Set the oven to 190degC/375degF/gas mark 5. Grease and line an 8.5in/20cm springform cake tin.\n3. Beat the eggs in a large mixing bowl and fold in all of the other ingredients, including the oranges.\n4. Pour the mixture into the cake tin and bake for an hour. In modern, fan-assisted, ovens this might be plenty of time. But if the cake still feels very wobbly give it longer, checking it at 10-minute intervals.\n5. Allow the cake to cool thoroughly before turning it out to serve.\n\nNOTES\nCooked for an hour - slightly overdone on the outside, but very nice in the middle\n\nSOURCE\nDaily Telegraph, May 27 2006, Weekend Supplement\n"
  },
  {
    "title": "Orange Biscuits",

    "filename": "Orange Biscuits.txt",

ents in a bowl and add the melted ingredients. Mix well until the dough becomes firm.\n10. Place the dough in a plastic bag and chill in the fridge for 40 minutes\n4. Roll the dough out on a lightly floured surface to 5mm thick and stamp out the cookies, using your chosen cutters. If you are using a template, cut around the template with a knife for each cookie.\n5. Lightly knead and re-roll the trimmings together again to use up all the dough. Place the biscuits on baking sheets. 6. Bake for at 160 C for 10 min. 10-15 minutes depending of the size of the cookies. Tip: Why not try adding the zest and juice of a lemon for zingy lemon-flavoured cookies until lightly coloured and firm but not crisp. Leave on the tray for two minutes before transferring to a wire rack to cool completely. Makes 12 stars\n12. Preheat the oven to 170ºC/325ºF/Gas Mark 3.\n13. Place butter, treacle and sugar into a saucepan and heat gently until the sugar has dissolved and the butter melted. Cool slightly\n14. Sieve the dry ingredients into a mixing bowl. Pour the melted mixture into the dry ingredients and stir.\n15. Dissolve the bicarbonate of soda in the milk and add to the mixture. Combine to make a dough, adding more milk if necessary.\n16. Place the dough in a plastic bag and chill in the fridge for 40 minutes.\n17. Continue as for vanilla cookies then bake for 10-15 minutes depending of the size of the cookies. Tip: for gingerbread men, try adding currants for eyes before baking Spiced orange cookies75g (3oz) butter75g (3oz) soft brown sugar30ml (2tbsp) honeyZest from one orange10ml (2 tsp) orange juice225g (8oz) plain flour, sifted5ml (1 tsp) bicarbonate soda5ml (1 tsp) cinnamon1. Preheat the oven to 170ºC/325ºF/Gas Mark 3.2. Place butter, sugar, honey, orange zest and juice in a saucepan and heat gently until the sugar has dissolved and the butter melted.3. Sieve the flour and dry ingredients in a bowl and add the melted ingredients. Mix well until the dough becomes firm.4. Place the dough in a plastic bag and chill in the fridge for 40 minutes5. Continue as for vanilla cookies. Bake for 10-15 minutes depending of the size of the cookies. Tip: Why not try adding the zest and juice of a lemon for zingy lemon-flavoured cookiesGingerbread cookies125g (4oz) butter60ml (4 tbsp) black treacle225g (8oz) soft brown sugar450g (1 lb) Plain flour15ml (1 tbsp) ground ginger7.5ml (1 ½ tsp) cinnamon5ml (1 tsp) bicarbonate of soda15ml (1 tbsp) milk1. Preheat the oven to 170ºC/325ºF/Gas Mark 3.2. Place butter, treacle and sugar into a saucepan and heat gently until the sugar has dissolved and the butter melted. Cool slightly3. Sieve the dry ingredients into a mixing bowl. Pour the melted mixture into the dry ingredients and stir.4. Dissolve the bicarbonate of soda in the milk and add to the mixture. Combine to make a dough, adding more milk if necessary.5. Place the dough in a plastic bag and chill in the fridge for 40 minutes.6. Continue as for vanilla cookies then bake for 10-15 minutes depending of the size of the cookies. Tip: for gingerbread men, try adding currants for eyes before bakingTop tip: Use these cookie recipes as the basis for making brilliant baubles or striking stockings Christmas tree decorations.wwww.lindyscakes.co.uk\n"

    "text": "Delia's Rhubarb and Ginger Brûlée\n\nServes: 6\n\nINGREDIENTS\n- 800g rhubarb\n- 1 rounded dessertspoon Cooks’ Ingredients Organic Ground Ginger\n- 2 pieces stem ginger, finely chopped\n- 3 heaped tablespoons demerara sugar\n- 200g Greek yogurt\n- 300ml Waitrose Extra Thick Jersey Double Cream or essential Waitrose Extra Thick Double Cream\n\nFor the brûlée:\n- 175g demerara sugar\n\n- I used a heatproof oval dish measuring 23 x 15cm at the base\n\nMETHOD\n1. Preheat the oven to 180°C, gas mark 4. You need to begin this by trimming and chopping the rhubarb into 2.5cm chunks, then pile them into a bowl, add the sugar and the ground and chopped ginger and toss them all together. After that, transfer everything to the baking dish, pop it into the oven on the centre shelf and bake for 20 minutes. Then carefully stir the rhubarb, turning it over, and bake for another 10–15 minutes or until it’s tender.\n2. When it’s cooked, leave the rhubarb to get completely cold, then tip as much of the juice out by drawing the fruit back gently with a draining spoon and allowing the juice to drain from one end of the tilted dish.\n3. When you’re ready to do the brûlée, preheat the grill to its highest setting for 15 minutes. Now combine the yogurt and thick cream in a bowl, and spoon it evenly over the top, making sure it goes right up to the edges of the dish. Next spoon the sugar evenly over the cream right up to the edges, and when the grill is really hot, place the dish about 7.5cm from the heat, and just let the sugar melt, bubble and caramelise to a rich golden brown. This will take about 8 minutes, but you’ll need to keep an eye on it as it may need a bit more or less time.\n4. When it’s cooled and the caramel has set, you can cover with clingfilm and keep it in the fridge till needed (it can be made up to 8 hours in advance). To serve, tap the caramel with a spoon and serve just as it is – nothing else needed. Notes on ingredients For a lighter version, the brûlée can be made with all yogurt or a 500g tub of fresh vanilla custard. If you don’t want to use preserved ginger add another quarter teaspoon ground ginger. This recipe is also brilliant with summer berries. And in the winter a pack of British garden fruits (or other frozen fruits) but in either case minus the ginger. Copyright Delia Smith 2010\n"

    "text": "Sticky Toffee Pudding\n\nServe: rs 6-8\n\nINGREDIENTS\n- Cake\n- 100g dark brown muscovado sugar\n- 175g SR flour\n- 125ml full fat milk\n- 1 large egg\n- 1 tsp vanilla extract\n- 50g unsalted butter (melted)\n- 200g chopped dates\n\n- Sauce\n- 200g dark brown muscovado sugar\n- 25g unsalted butter in little blobs\n- 500ml boiling water\n\nMETHOD\n1. 1\tPreheat the oven to 190°C/gas mark 5/375ºF and butter a 1½ litre / 6 cups capacity pudding dish. 2\tCombine the 100g / ½ cup of dark muscovado sugar with the flour in a large bowl. Pour the milk into a measuring jug, beat in the egg, vanilla and melted butter and then pour this mixture over the sugar and flour, stirring - just with a wooden spoon - to combine. Fold in the dates then scrape into the prepared pudding dish. Don't worry if it doesn't look very full: it will do by the time it cooks. 3\tSprinkle over the 200g / 1 cup of dark muscovado sugar and dot with the butter. Pour over the boiling water (yes really!) and transfer to the oven. Set the timer for 45 minutes, though you might find the pudding needs 5 or 10 minutes more. (I did 20 min more). The top of the pudding should be springy and spongy when it's cooked; underneath, the butter, dark muscovado sugar and boiling water will have turned into a rich, sticky sauce. Serve with vanilla ice cream, creme fraiche, double or single cream as you wish.\n\nSOURCE\nwww.nigella.com/recipes/view/easy-sticky-toffee-pudding-180\n"

    "text": "Ingredients\n\nServes: 8-10\n\nINGREDIENTS\n- 1 x 4kg/8lb 13oz pumpkin\n- 125g/4oz butter\n- 2 medium onions, peeled, finely chopped\n- 1 cinnamon stick\n- freshly grated nutmeg\n- salt and freshly ground black pepper\n- 1.7 litres/3 pints chicken stock (vegetarians may substitute vegetable stock)\n- 3 tablespoons sherry\n\nMETHOD\n1. Cut the top off the pumpkin and set aside. Scoop out the seeds and fibres from the middle and discard.\n2. Using a sharp knife and a spoon, carefully hollow out the pumpkin, removing the flesh and setting aside. (It is imperative that you do not cut right up to the inside of the skin or pierce it. Leave 2cm/1in of flesh all around the inside.)\n3. Roughly chop the scooped-out pumpkin flesh.\n4. Melt the butter in a large pan with a lid over a low heat and add the onions. Cook the onions gently for 10-15 minutes, until they are softened and golden-brown.\n5. Add the pumpkin flesh, the cinnamon and nutmeg, and season, to taste, with salt and freshly ground black pepper. Increase the heat to medium and cover with the lid. Cook for 40-45 minutes, stirring occasionally to prevent the base from burning, until the pumpkin is cooked through.\n6. Add the stock and bring to the boil. Remove from the heat and allow to cool slightly. Transfer the soup to a food processor in batches and blend until smooth.\n7. Return the soup to the pan and bring to a low simmer and cook for a further half an hour.\n8. Forty-five minutes before eating, preheat the oven to 170C/335F/Gas 3.\n9. Pour the soup into the hollow pumpkin shell, add the sherry and stir to combine.\n10. Place the reserved pumpkin 'lid' onto the pumpkin and place onto a large baking tray. Cook in the oven for about 45 minutes, to bring the soup up to temperature.\n11. To serve, carefully remove from the oven and serve the soup in the pumpkin at the table. Ladle into bowls and serve.\n\nSOURCE\nhttp://www.bbc.co.uk/food/recipes/pumpkinsoup_89904\n"
