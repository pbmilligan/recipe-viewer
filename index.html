<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f0e8">
  <title>Recipe Folio</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e8;
      --card: #fffdf8;
      --ink: #202d28;
      --muted: #69746d;
      --line: #dce1d8;
      --green: #355b49;
      --green-dark: #274738;
      --sage: #e6ede5;
      --citrus: #df9e4b;
      --shadow: 0 22px 65px rgb(39 61 48 / 9%);
    }

    * { box-sizing: border-box; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 88% 5%, rgb(225 198 150 / 18%), transparent 30rem),
        radial-gradient(ellipse at 8% 28%, rgb(147 177 150 / 14%), transparent 28rem),
        var(--paper);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.55;
    }

    button, input { font: inherit; }

    .shell { width: min(1100px, calc(100% - 40px)); margin: 0 auto; }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgb(53 91 73 / 13%);
    }

    .brand { display: flex; align-items: center; gap: 11px; font-size: .78rem; font-weight: 800; letter-spacing: .16em; }
    .brand-mark { display: grid; width: 26px; height: 26px; place-items: center; color: white; background: var(--green); border-radius: 50% 50% 50% 7px; font-size: .8rem; }
    .top-note { color: var(--muted); font-size: .82rem; }

    .intro { max-width: 820px; padding: 13px 0 12px; }
    .eyebrow { margin: 0 0 3px; color: var(--green); font-size: .6rem; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
    h1 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(1.9rem, 3.4vw, 2.65rem); font-weight: 500; letter-spacing: -.055em; line-height: 1; }
    .intro-copy { max-width: 650px; margin: 9px 0 0; color: var(--muted); font-size: .94rem; }

    .upload-panel {
      position: relative;
      display: flex;
      align-items: center;
      gap: 20px;
      min-height: 82px;
      padding: 14px 19px;
      border: 1.5px dashed #9aaf9d;
      border-radius: 18px;
      background: rgb(255 253 248 / 72%);
      transition: border-color .2s ease, background .2s ease, transform .2s ease;
    }

    .upload-panel.is-over { border-color: var(--green); background: #eef4ec; transform: translateY(-2px); }
    .upload-icon { display: grid; flex: 0 0 44px; width: 44px; height: 44px; place-items: center; border-radius: 13px; color: var(--green); background: var(--sage); }
    .upload-icon svg { width: 22px; height: 22px; }
    .upload-copy { flex: 1; }
    .upload-copy strong { display: block; font-size: 1rem; }
    .upload-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: .87rem; }
    .choose-button { flex: 0 0 auto; padding: 9px 15px; border: 0; border-radius: 999px; color: white; background: var(--green); cursor: pointer; font-size: .84rem; font-weight: 700; transition: background .2s ease, transform .2s ease; }
    .choose-button:hover { background: var(--green-dark); transform: translateY(-1px); }
    .choose-button:focus-visible, .remove-button:focus-visible, .file-input:focus-visible + .focus-target { outline: 3px solid var(--citrus); outline-offset: 3px; }
    .file-input { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }
    .focus-target { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; }

    .message { min-height: 20px; margin: 4px 4px 0; color: var(--muted); font-size: .78rem; }
    .message.error { color: #9b3f2d; }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin: 19px 0 11px; }
    .section-head h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.35rem; font-weight: 500; }
    .recipe-count { color: var(--muted); font-size: .82rem; }
    .recipe-list { display: grid; gap: 22px; padding-bottom: 72px; }

    .search-panel { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; margin: 18px 0 9px; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; top: 50%; left: 15px; width: 17px; height: 17px; color: #718077; transform: translateY(-50%); pointer-events: none; }
    .search-input { width: 100%; height: 48px; padding: 0 16px 0 43px; border: 1px solid #ccd6cc; border-radius: 13px; color: var(--ink); background: var(--card); font-size: .96rem; outline: none; }
    .search-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgb(53 91 73 / 12%); }
    .search-input::placeholder { color: #88948c; }
    .search-scope { display: flex; gap: 3px; padding: 4px; border: 1px solid #d7ded6; border-radius: 12px; background: #e9eee7; }
    .scope-button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 9px; color: #58675d; background: transparent; cursor: pointer; font-size: .82rem; font-weight: 700; white-space: nowrap; }
    .scope-button[aria-pressed="true"] { color: var(--green-dark); background: white; box-shadow: 0 1px 4px rgb(30 53 39 / 10%); }
    .index-meta { display: flex; justify-content: space-between; min-height: 25px; margin: 2px 3px 8px; color: var(--muted); font-size: .78rem; }
    .recipe-index { overflow: hidden; margin-bottom: 56px; border: 1px solid rgb(53 91 73 / 12%); border-radius: 16px; background: var(--card); box-shadow: 0 12px 38px rgb(39 61 48 / 6%); }
    .recipe-row { display: grid; grid-template-columns: minmax(0, 1fr) auto 22px; align-items: center; gap: 16px; width: 100%; min-height: 55px; padding: 10px 17px; border: 0; border-bottom: 1px solid #edf0e9; color: var(--ink); background: transparent; text-align: left; cursor: pointer; }
    .recipe-row:last-child { border-bottom: 0; }
    .recipe-row:hover, .recipe-row:focus-visible { background: #f2f6f0; outline: none; }
    .recipe-row:focus-visible { box-shadow: inset 0 0 0 2px var(--green); }
    .row-title { overflow: hidden; font-family: Georgia, "Times New Roman", serif; font-size: 1.04rem; text-overflow: ellipsis; white-space: nowrap; }
    .row-category { overflow: hidden; color: var(--muted); font-size: .75rem; text-overflow: ellipsis; white-space: nowrap; }
    .row-arrow { color: #849388; font-size: 1rem; }
    .list-empty { padding: 28px 20px; color: var(--muted); text-align: center; }
    .selection-bar { display: flex; align-items: center; gap: 14px; margin: 18px 0 14px; }
    .back-button { padding: 7px 12px; border: 1px solid #cbd6cb; border-radius: 999px; color: var(--green); background: var(--card); cursor: pointer; font-size: .82rem; font-weight: 700; }
    .back-button:hover { background: var(--sage); }
    .selected-caption { color: var(--muted); font-size: .8rem; }
    .recipe-view { padding-bottom: 60px; }
    .recipe-view[hidden], .recipe-index[hidden], .selection-bar[hidden] { display: none; }
    .original-disclosure { margin: 12px 0 28px; overflow: hidden; border: 1px solid rgb(53 91 73 / 14%); border-radius: 13px; background: rgb(255 253 248 / 78%); }
    .original-disclosure summary { padding: 12px 15px; color: var(--green); cursor: pointer; font-size: .85rem; font-weight: 750; }
    .original-disclosure summary::marker { color: var(--citrus); }
    .original-text { max-height: 65vh; overflow: auto; margin: 0; padding: 15px; border-top: 1px solid var(--line); color: #46544b; background: #fbfaf5; font: .84rem/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .upload-input { display: none; }

    .recipe-overview { margin: 0 0 15px; padding: 14px 17px; border: 1px solid rgb(53 91 73 / 13%); border-radius: 15px; background: rgb(255 253 248 / 82%); }
    .recipe-overview[hidden] { display: none; }
    .overview-title { margin: 0 0 9px; color: var(--green); font-size: .68rem; font-weight: 850; letter-spacing: .15em; text-transform: uppercase; }
    .overview-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 6px 14px; margin: 0; padding: 0; list-style: none; }
    .overview-link { display: flex; align-items: baseline; gap: 9px; min-width: 0; padding: 4px 2px; color: var(--ink); text-decoration: none; font-size: .88rem; }
    .overview-link::before { flex: 0 0 auto; color: var(--citrus); content: "↗"; font-size: .78rem; }
    .overview-link:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }

    .recipe-card { overflow: hidden; scroll-margin-top: 20px; border: 1px solid rgb(53 91 73 / 10%); border-radius: 21px; background: var(--card); box-shadow: var(--shadow); animation: arrive .35s ease both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .recipe-header { position: relative; padding: 34px 40px 30px; color: white; background: var(--green); }
    .recipe-header::after { position: absolute; right: 30px; bottom: -38px; width: 128px; height: 128px; border: 1px solid rgb(255 255 255 / 14%); border-radius: 50%; content: ""; box-shadow: 0 0 0 17px rgb(255 255 255 / 4%), 0 0 0 35px rgb(255 255 255 / 3%); }
    .recipe-kicker { position: relative; z-index: 1; margin: 0 0 9px; color: #d9e6d9; font-size: .7rem; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
    .recipe-title { position: relative; z-index: 1; max-width: 780px; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 500; letter-spacing: -.035em; line-height: 1.08; }
    .details { position: relative; z-index: 1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 21px; }
    .detail-chip { padding: 6px 11px; border: 1px solid rgb(255 255 255 / 22%); border-radius: 999px; color: #f7f4ea; background: rgb(255 255 255 / 9%); font-size: .8rem; }
    .recipe-body { display: grid; grid-template-columns: minmax(240px, .8fr) minmax(0, 1.35fr); }
    .recipe-body.ingredients-only { grid-template-columns: 1fr; }
    .recipe-body.method-only { grid-template-columns: 1fr; }
    .ingredients-panel, .method-panel { padding: 31px 38px 36px; }
    .ingredients-panel { background: #f9f8f1; border-right: 1px solid var(--line); }
    .recipe-section + .recipe-section { margin-top: 30px; }
    .section-title { display: flex; align-items: center; gap: 10px; margin: 0 0 17px; color: var(--green); font-size: .72rem; font-weight: 850; letter-spacing: .17em; text-transform: uppercase; }
    .section-title::after { width: 28px; height: 1px; background: #c9d5c8; content: ""; }
    .ingredient-list { display: grid; gap: 11px; margin: 0; padding: 0; list-style: none; }
    .ingredient-item { display: grid; grid-template-columns: 17px 1fr; gap: 9px; align-items: start; font-size: .94rem; }
    .ingredient-item::before { width: 7px; height: 7px; margin: .53em 0 0 4px; border-radius: 50%; background: var(--citrus); content: ""; }
    .ingredient-group { margin: 15px 0 -3px; color: var(--green); font-family: Georgia, "Times New Roman", serif; font-size: 1.05rem; font-style: italic; }
    .method-list { display: grid; gap: 18px; margin: 0; padding: 0; list-style: none; counter-reset: method; }
    .method-item { display: grid; grid-template-columns: 31px 1fr; gap: 13px; align-items: start; counter-increment: method; font-size: .96rem; }
    .method-item::before { display: grid; width: 29px; height: 29px; place-items: center; border-radius: 50%; color: var(--green); background: var(--sage); content: counter(method); font-size: .76rem; font-weight: 800; }
    .method-item.method-preface { grid-template-columns: 1fr; counter-increment: none; }
    .method-item.method-preface::before { display: none; }
    .method-paragraph { margin: 0; color: #39453f; }
    .plain-recipe { padding: 30px 40px 38px; }
    .plain-recipe .recipe-title { color: var(--ink); }
    .plain-text { overflow-wrap: anywhere; margin: 20px 0 0; padding: 20px 22px; border-left: 3px solid var(--citrus); border-radius: 0 12px 12px 0; color: #35413b; background: #f7f6f0; font: .94rem/1.7 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
    .plain-recipe .remove-button { color: var(--green); border-color: var(--line); }
    .notes-source { padding: 0 38px 34px; }
    .note-block { margin-top: 0; padding: 20px 22px; border-top: 1px solid var(--line); }
    .note-block .section-title { margin-bottom: 8px; }
    .note-text { margin: 0; color: var(--muted); font-size: .92rem; white-space: pre-wrap; }
    .source-text { color: var(--green); }
    .empty-state { display: grid; min-height: 210px; place-items: center; padding: 34px; border: 1px solid rgb(53 91 73 / 9%); border-radius: 20px; color: var(--muted); background: rgb(255 253 248 / 55%); text-align: center; }
    .empty-state[hidden] { display: none; }
    .empty-state p { max-width: 390px; margin: 0; }
    .remove-button { position: relative; z-index: 2; margin-top: 18px; padding: 7px 12px; border: 1px solid rgb(255 255 255 / 35%); border-radius: 999px; color: white; background: transparent; cursor: pointer; font-size: .78rem; }
    .remove-button:hover { background: rgb(255 255 255 / 12%); }

    @media (max-width: 720px) {
      .shell { width: min(100% - 28px, 620px); }
      .topbar { padding: 7px 0; }
      .top-note { max-width: 135px; text-align: right; }
      .intro { padding: 12px 0 10px; }
      h1 { font-size: clamp(1.8rem, 7vw, 2.35rem); }
      .upload-panel { align-items: center; gap: 12px; padding: 12px 14px; }
      .upload-icon { flex-basis: 40px; width: 40px; height: 40px; border-radius: 12px; }
      .choose-button { align-self: center; padding: 9px 12px; }
      .upload-copy span { font-size: .79rem; }
      .recipe-header { padding: 28px 25px 25px; }
      .recipe-body { grid-template-columns: 1fr; }
      .ingredients-panel, .method-panel { padding: 27px 25px 30px; }
      .ingredients-panel { border-right: 0; border-bottom: 1px solid var(--line); }
      .notes-source { padding: 0 25px 25px; }
      .plain-recipe { padding: 27px 25px 30px; }
      .search-panel { grid-template-columns: 1fr; gap: 8px; }
      .search-scope { justify-self: start; }
      .recipe-row { grid-template-columns: minmax(0, 1fr) auto 18px; gap: 9px; padding-inline: 13px; }
    }

    @media (max-width: 440px) {
      .upload-panel { flex-wrap: wrap; }
      .upload-copy { min-width: 0; }
      .choose-button { width: 100%; margin-left: 52px; }
      .top-note { font-size: .72rem; }
      .recipe-count { text-align: right; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>RECIPE FOLIO</span></div>
    <div class="top-note">Your recipe collection</div>
  </header>

  <main class="shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Cook something good</p>
      <h1 id="page-title">Your recipes, together.</h1>
    </section>

    <section aria-labelledby="collection-title">
      <h2 id="collection-title" class="visually-hidden">Recipe collection</h2>
      <div class="search-panel">
        <label class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4 4"/></svg>
          <input id="search-input" class="search-input" type="search" placeholder="Search recipes" autocomplete="off" aria-label="Search recipes">
        </label>
        <div class="search-scope" role="group" aria-label="Search within">
          <button class="scope-button" type="button" data-scope="all" aria-pressed="true">All text</button>
          <button class="scope-button" type="button" data-scope="ingredients" aria-pressed="false">Ingredients</button>
        </div>
      </div>
      <div class="index-meta"><span id="result-count"></span><span id="search-hint">Choose a recipe to open it</span></div>
      <div class="recipe-index" id="recipe-index"></div>
      <div class="selection-bar" id="selection-bar" hidden>
        <button class="back-button" id="back-button" type="button">← All recipes</button>
        <span class="selected-caption">One recipe at a time</span>
      </div>
      <div class="recipe-view" id="recipe-view" hidden></div>
    </section>
  </main>

  <input class="upload-input" id="file-input" type="file" accept=".txt,.text,.md,text/plain" multiple aria-label="Upload recipe files">

  <script id="recipe-data" type="application/json">
[
  {
    "title": "Avocado, Bacon and Blueberry Salad",
    "category": "Fast Diet",
    "filename": "Avocado, Bacon and Blueberry Salad - 290 calories.txt",
    "text": "Avocado, Bacon and Blueberry Salad\n\nServes: 4\nCalories: 290 per serving\n\nINGREDIENTS\n- 8 rashers smoked streaky bacon\n- 100g rocket\n- 1 large avocado chopped\n- 100g blueberries\n\nFor the dressing:\n- 50g blueberries\n- 2 tbsp olive oil\n- 0.5 tbsp balsamic vinegar\n- 1 tbsp Dijon mustard\n- 1 tsp clear honey\n\nAlternative dressing:\n- ½ cup Blueberries\n- 2 tsp Honey\n- ¼ cup Olive Oil\n- ½ cup Plain Yogurt\n\nMETHOD\n1. Heat a non-stick frying pan over a high heat and cook the bacon for 2 min on each side until crisp. Set aside to cool completely.\n2. Meanwhile, make the dressing. Put the blueberries, oil, vinegar, mustard and honey into the bowl of a food processor (or use a stick blender) and whizz to combine. Season well.\n3. In a serving bowl, toss together the rocket, avocado and blueberries, then crumble over the bacon and drizzle with the blueberry dressing.\n"
  },
  {
    "title": "Bacon Butter bean Soup",
    "category": "Fast Diet",
    "filename": "Bacon Butterbean Soup - 386 calories.txt",
    "text": "Bacon Butter bean Soup\n\nCalories: 386\nServes: 1\n\nINGREDIENTS\n- 2 rashers of bacon (54g, 116 cal)\n- 1 tsp olive oil (27 cal)\n- Half small onion (30g, 11 cal)\n- Half leek (50g, 11 cal)\n- Half carrot (40g, 14 cal)\n- 1 stalk celery (1 cal)\n- Half can of butter beans (200g, 206 cal)\n\nMETHOD\n1. Finely chop all veg.\n2. Fry bacon in oil for 2 min.\n3. Add veg and cook for 5 min, adding a splash of water if it sticks.\n4. Add butter beans and half a pint of water (250ml) and simmer for 20 min.\n5. Season, blend or mash. For 4: * 8 rashers of bacon * 1tbsp  olive oil * 2 small onion * 2leek * 2 carrot * 4 stalk celery * 2 can of butter beans\n"
  },
  {
    "title": "Borlotti Bean Bolognaise - 180 calories",
    "category": "Fast Diet",
    "filename": "Borlotti Bean Bolognaise - 180 calories.txt",
    "text": "Borlotti Bean Bolognaise - 180 calories\n\nINGREDIENTS\n- (Instructions for two people)\n\n- Cooking oil spray\n- 2 garlic cloves, crushed\n- 1 onion, chopped\n- 1 red pepper, diced\n- 100g button mushrooms, sliced\n- 1tsp mixed herbs\n- 400g tin tomatoes\n- 1tbsp tomato puree\n- Pinch caster sugar\n- 400g can borlotti beans, drained and rinsed\n- Salt and pepper\n\nMETHOD\n1. Heat oil in a large pan and gently fry the onion, garlic and pepper for 3 minutes until softened. Add the mushrooms, herbs, sugar, tomatoes, tomato puree and sugar and cook for a further 3 minutes. Add beans, the cover and simmer for 20-30 minutes until the sauce has reduced. Season and serve.\n\nNOTES\nUsed black-eyed beans instead of borlotti beans\n\nSOURCE\nFast Cook, p26.\n"
  },
  {
    "title": "Chicken stir-fry - 306 calories (inc 1 tangerine: 70g, 25 calories)",
    "category": "Fast Diet",
    "filename": "Chicken stir-fry - 281 calories.txt",
    "text": "Chicken stir-fry - 306 calories (inc 1 tangerine: 70g, 25 calories)\n\nINGREDIENTS\n- (Instructions for one person)\n\n- Cut chicken fillet into strips (140g, 148 calories).\n\nMETHOD\n1. Fry in a non-stick pan in a tsp olive oil (27 calories) with: a tsp finely chopped ginger (2 calories) a tbsp chopped coriander (3 calories) a clove of crushed garlic (3 calories) 2 tsp soy sauce (3 calories) half a squeezed lemon (1 calorie)\n2. until browned and sealed, adding water if chicken sticks.\n3. Add a handful of sugar snap peas (50g, 12 calories), 100g finely sliced cabbage (26 calories) and 2 carrots cut into thin strips (160g, 56 calories), and cook for 5-10 more minutes until the chicken is cooked, adding water if necessary.\n"
  },
  {
    "title": "CHICKPEA CURRY IN A HURRY",
    "category": "Fast Diet",
    "filename": "CHICKPEA CURRY IN A HURRY.txt",
    "text": "CHICKPEA CURRY IN A HURRY\n\nCalories: 249 PER PORTION\nServes: 2\n\nINGREDIENTS\n- Five minutes. One store cupboard. Two forks. Done.\n\n- Cooking oil spray\n- 1 onion, diced\n- 2 garlic cloves, crushed\n- 3 tsp curry powder\n- 1/8 tsp dried chilli flakes (1/4 tsp much too strong for Emily)\n- 200ml boiling water\n- 1 vegetable stock cube\n- 2 tbsp tomato purée\n- 1 400g tin chickpeas, rinsed and drained\n- Salt and pepper\n- 1 tbsp low-fat natural yoghurt, to serve\n\nMETHOD\n1. Heat a pan and spray with oil. Gently fry the onion and garlic until softened. Add curry powder and chilli flakes and cook for a further 2 minutes. Add boiling water, stock cube, tomato purée and chickpeas. Simmer until chickpeas are heated through and the sauce thickened. Season and serve with a swirl of natural yoghurt, and perhaps a salad of thinly sliced cucumber.\n2. OPTIONAL EXTRAS: add a handful of spinach leaves or 10 cherry tomatoes (+35 cals) for the last 2 minutes of cooking.\n3. FAST DAY TIP: to make a curry with more complexity, add a cinnamon stick, 3 curry leaves, a clove, 1 tsp nigella seeds, a halved chilli and a couple of cardamom pods to the pan with the frying onion; add 2 tbsp almonds (+70 cals) for a thicker curry sauce. grgund\n"
  },
  {
    "title": "Green lentil and mint - 224 calories",
    "category": "Fast Diet",
    "filename": "Green lentil and mint - 224 calories.txt",
    "text": "Green lentil and mint - 224 calories\n\nServes: four\n\nINGREDIENTS\n- 250g green lentils, rinsed\n- 800ml cold water\n- 1 tsp ground turmeric\n- 1 tbsp sunflower oil\n- 1 tsp cumin seeds\n- 1 white onion, thinly sliced\n- salt and pepper\n- mint and parsley to serve\n\nMETHOD\n1. Put lentils in a pan with cold water and bring to the boil.\n2. Skim off froth, then stir in the turmeric.\n3. Reduce heat and simmer, uncovered, for 15-20 minutes, stirring occasionally until you have a puree. Add a little boiling water if too thick.\n4. Heat oil in a small frying pan and fry cumin seeds for a minute, then add onion and sauté for 5 minutes until softened.\n5. Add onion mix to cooked lentils.\n6. Season and serve topped with plenty of mint and parsley.\n\nSOURCE\nThe Fast Diet Recipe Book, p80\n"
  },
  {
    "title": "HUEVOS RANCHEROS",
    "category": "Fast Diet",
    "filename": "Huevos Rancheros - 283 calories.txt",

    "text": "Bacon and Egg Fried Rice\n\nServes: 4\n\nINGREDIENTS\n- 250g long-grain rice, well rinsed\n- 1.5 tbsp olive oil\n- 100g streaky bacon, diced\n- 2 peppers, ﬁnely sliced\n- 2 red onions, ﬁnely chopped\n- 200g carrots, peeled and coarsely grated\n- 2 garlic cloves, crushed\n- 5cm piece ginger, peeled and grated\n- 1 red chilli, ﬁnely chopped (optional)\n- 2 eggs\n- 2 tbsp soy sauce\n\nMETHOD\n1. Cook the rice in a large pan of boiling water for 10 mins until nearly tender. Drain, rinse with cold water and drain again. Set aside.\n2. Meanwhile, heat 1/2 tbsp oil in a frying pan over a high heat and fry the bacon for 5-7 mins until golden and crisp. Remove from the pan with a slotted spoon and set aside. Add 1 tbsp oil and fry the peppers for 10 mins until lightly charred. Add the onions, carrots, garlic, ginger and chilli and fry over a medium high heat for 5 mins more.\n3. Add the bacon and rice and fry for 5 mins, stirring frequently. Push the rice mixture to one side of the pan and crack the eggs into the gap. Beat the eggs with a wooden spoon, then stir through the rice. Cook for 2 mins, then add the soy sauce and remove from the heat. Divide between 4 shallow bowls to serve.\n\nNOTES\nTakes 35 minutes\n\nSOURCE\nTesco magazine, February 2020\n"

    "filename": "Beef and Guinnness Stew.txt",
    "text": "Beef and Guinness Stew\n\nTake: n from 'Irish Traditional Cooking' by Darina Allen (Kyle Books, £25).\n\nINGREDIENTS\n- Ingredients to serve 6-8\n\n- 900g lean stewing beef\n- 3 tablespoons oil or dripping\n- 2 tablespoons flour\n- Salt, freshly ground pepper and cayenne\n- 2 large onions (about 285g), coarsely chopped\n- 1 large garlic clove, crushed (optional)\n- 2 tablespoons tomato purée, dissolved in 4 tablespoons water\n- 300ml (½ pint) Guinness\n- 225g carrots, cut into chunks\n- Sprig of thyme\n- Chopped parsley for garnish\n\n- 1200g lean stewing beef\n- 4 tablespoons oil or dripping\n- 2.66 tablespoons flour\n- Salt, freshly ground pepper and cayenne\n- 2 large onions (about 380g), coarsely chopped\n- 1 large garlic clove, crushed (optional)\n- 2.66 tablespoons tomato purée, dissolved in 5.33 tablespoons water\n- 400ml (½ pint) Guinness\n- 300g carrots, cut into chunks\n- Sprig of thyme\n- Chopped parsley for garnish\n\nMETHOD\n1. Trim the meat of any fat or gristle, cut into cubes of 5cm and toss them in a bowl with 1 tablespoon oil. Season the flour with salt, freshly ground pepper and a pinch or two of cayenne. Toss the meat in this mixture.\n2. Heat the remaining oil or dripping in a wide frying pan over a high heat. Brown the meat on all sides.\n3. Add the onions, crushed garlic (if using) and tomato purée to the pan, cover and cook gently for about 5 minutes.\n4. Transfer the contents of the pan to a casserole, and pour some of the Guinness into the frying pan. Bring to the boil and stir to dissolve the caramelized meat juices in the pan. Pour on to the meat with the remaining Guinness; add the carrots and the thyme. Stir, taste, and add a little more salt if necessary.\n5. Cover with the lid of the casserole and simmer very gently until the meat is tender – 2 to 3 hours. The stew may be cooked on top of the stove or in a low oven at 150C/gas mark 2. Taste and correct the seasoning.\n6. Scatter with lots of chopped parsley and serve with champ, colcannon or plain boiled potatoes.\n7. https://www.independent.co.uk/life-style/food-and-drink/recipes/beef-and-guinness-stew-8437572.html\n"

    "text": "Chili Chocolate Bread\n\nPrep Time: 20 minutes minutes\nCook Time: 30 minutes minutes\nTotal time: 1 hour hour 50 minutes minutes\nServes: 8 servings\nCalories: 232kcal\n\nINGREDIENTS\n- Proofing 1 hour hour\n\n- 3 cups bread flour\n- 2 tablespoons white sugar or honey\n- 2 teaspoons fast-action yeast\n- 1/2 cup warm water\n- 1 cup cool water\n- 1 teaspoon red chili flakes\n- 1 teaspoon salt\n- 1/4 cup sugar\n- 1/2 cup cocoa powder\n\nMETHOD\n1. In a mixer bowl add the warm water, honey (or sugar), salt, yeast, and a few tablespoons of flour.\n2. Stir the mixture and set aside for 15 minutes to activate the yeast.\n3. Add the remaining flour, sugar, cocoa, and chili flakes then place on the mixer with a dough hook and mix for 10 minutes.\n4. Remove and shape the dough and place into a loaf tin and leave in a warm place for 1 hour to rise to double in size.\n5. Pre-heat oven to 400 degrees Fahrenheit and bake for 30-35 minutes until turning dark on top.\n6. Allow to cool for 20 minutes before slicing and serving with some butter.\n\nSOURCE\nhttps://pepperscale.com/chili-chocolate-bread/\n"

    "filename": "Lamb Burgers with Hoisin and Spring Onions.txt",
    "text": "Lamb Burgers with Hoisin and Spring Onions\n\nINGREDIENTS\n- Makes 4 burgers\n\n- 1lb minced lamb\n- 2 tbsp hoisin sauce\n- 4 spring onions, chopped\n- 2 tbsp chopped fresh coriander\n- 2 tbsp chopped fresh mint\n- 1 tbsp finely chopped fresh ginger\n- 1 tbsp soy sauce\n- 1 tsp mild chilli powder\n- 1 garlic clove, finely chopped\n- 1 tsp salt\n- 0.5 tsp black pepper\n\nMETHOD\n1. Place all the ingredients in a large bowl and, using your hands, mix until the ingredients are evenly incorporated. Divide the mixture into 4 burgers and grill for 5-7 minutes until cooked through and serve in a bun with salad, or as desired.\n\nNOTES\nI've changed the food names to British were appropriate (e.g. cilantro -\u003e coriander). The original recipe had far more meat (1.5-1.75 lbw), which would have been too much for 4 burgers, so it's possible the seasonings should be toned down a bit. The original recipe suggested serving with rice.\n\nSOURCE\nRecipe of the Week: Burgers by Sally Sampson, p. 39\n"

    "title": "Cajun Chicken Pasta",

    "filename": "Cajun Chicken Pasta.txt",
    "text": "Cajun Chicken Pasta\n\nTakes: 30 minute. Serves 4\n\nINGREDIENTS\n- 1 tbsp olive oil\n- 650g diced chicken\n- 3 garlic cloves, finely chopped or grated\n- 4 tsp Cajun-style seasoning\n- 400g can chopped tomatoes\n- 1 chicken stock cube, crumbled\n- 140g coconut cream\n- 20g parmesan, finely grated, plus extra to serve\n- half lemon, juiced\n- chopped parsley, to serve (optional)\n\nMETHOD\n1. Heat the olive oil in a large, shallow saucepan or deep frying pan over a medium heat, then add the chicken, season lightly and fry for 6-8 mins, stirring occasionally until just golden all over – no need to worry about it being cooked through at this stage.\n2. Stir in the garlic and cook for 2 mins more, then scatter over the Cajun-style seasoning and stir so the chicken pieces are evenly coated. Tip in the tomatoes, a quarter of a can of water and the stock cube. Stir, then bring to a simmer and cook for 5 mins.\n3. Meanwhile, cook the pasta.\n4. Stir the cream into the chicken and continue to simmer gently for 2 min, then stir in the parmesan and lemon juice, and cook for 1 min more. Scatter with parsley, if you like, and extra parmesan.\n\nNOTES\nChanged cream for coconut cream, didn’t cook pasta in the sauce, serves 4 not 6.\n\nSOURCE\nhttps://www.bbcgoodfood.com/recipes/cajun-chicken-one-pot\n"

    "text": "Cheeky Chicken and Potato One Pot\n\nServes: 4-6\n\nINGREDIENTS\n- 500g chicken thighs, cut into large chunks\n- 600g pumpkin or squash, peeled, deseeded and cut into 4cm chunks\n- 600g Desiree potatoes, peeled and cut into 4cm chunks\n- 150g green beans, trimmed and halved\n- Small handful of basil leaves, roughly torn\n- 2tbsp sunflower oil\n- 1 large onion, roughly chopped\n- 2-3tbsp red curry paste\n- 400g reduced-fat tinned coconut milk\n- 350ml hot chicken stock\n\nMETHOD\n1. Heat oil in a very large pan or flameproof casserole dish. Add the chicken and onion, and cook for 10 minutes, stirring until the chicken is golden. Stir in the curry paste and cook for a further minute before adding the pumpkin and potatoes.\n2. Add the coconut milk and stock, bring to the boil, cover loosely and simmer for 5 minutes; uncover and cook for a further 10 minutes. Stir in the beans and cook for 4 minutes until they are almost tender. Stir through the basil, remove from the heat and leave to infuse for a few minutes before serving.\n\nNOTES\n\nUsed butternut squash and full-fat coconut milk\n\nSOURCE\nEssentials magazine\n"

  {
    "title": "My mother’s cheese and onion pie",
    "category": "Savoury",
    "filename": "Cheese and Onion Pie.txt",
    "text": "My mother’s cheese and onion pie\n\nServes: 4\n\nINGREDIENTS\n- 30 mins to 1 hour preparation time\n- 30 mins to 1 hour cooking time\n\nFor the pastry:\n\n- 60g/2oz butter, cut into small pieces\n- 60g/2oz lard, cut into small pieces\n- 200g/7oz self-raising flour, plus extra for dusting\n- pinch salt\n\nFor the filling:\n\n- 25g/1oz butter\n- 3 onions, roughly sliced\n- salt and freshly ground white pepper\n- 250g/9oz Lancashire cheese, coarsely grated\n- milk, for sealing and glazing\n\n- Preparation method\n\nMETHOD\n1. Preheat the oven to 180C/350F/Gas 4 and place a baking tray in the oven to heat through.\n2. For the pastry, place the butter and lard into a large bowl with the flour and salt. Gently rub the fat into the flour using finger tips until the texture resembles very coarse breadcrumbs. Alternatively use a food processor to bind the fat and flour.\n3. Add 2-3 tbsp ice cold water to bind the mixture. Lightly knead the dough until well amalgamated, dust with flour and place into a sealable plastic bag. Chill in the fridge for 30 minutes before using. If you are in a rush, you can use the dough straightaway.\n4. For the filling, heat the butter in a saucepan and fry the onions for 10 minutes, without colouring. Stir in 150ml/3fl oz water, salt and freshly ground black pepper and cook until almost all the liquid has evaporated. Remove the onions, spread out onto a plate and set aside to cool.\n5. Roll out two-thirds of the pastry until it is about 0.5cm/¼in thick and line a greased 20cm/8in loose-bottomed tart tin, leaving any excess pastry overhanging the edge.\n6. Now roll out the remaining pastry to a similar thickness which will also be generously wide enough to use as a lid to the pie. Cover the base of the pie with half of the onions and then cover with half the grated cheese.\n7. Repeat the layering process in step 6 until all the mixture is used up.\n8. Roll out the remaining pastry to make a lid for the pie. Brush the edges of the pastry case with milk to seal the pastry lid upon it, while also pressing the edges together lightly before trimming off any excess overhang. Brush the surface of the pie with milk. Make three small incisions into the centre of the pie using the point of a sharp knife and, if you wish, further decorate to make a lattice effect.\n9. Place the pie into the oven and bake for 40-50 minutes, or until golden-brown. Remove from the oven and leave for a good 20-30 minutes before un-moulding and cutting into generous wedges.\n10. Serve the pie warm or at room temperature (not piping hot).\n\nSOURCE\nSimon Hopkinso from The Good Cook\n"
  },

    "filename": "Chicken Pad Thai.txt",
    "text": "Chicken pad Thai\n\nServes: 4\nTakes: 1 hr 50 mins\nCalories: 611 per serving\n\nINGREDIENTS\n- 2 limes, 1½ juiced, ½ cut into wedges\n- 1½ tsp demerara sugar\n- 2 garlic cloves, finely chopped\n- 15g ginger, peeled and finely chopped\n- 2 tbsp smooth peanut butter\n- 1 tbsp reduced-salt soy sauce\n- 1 tbsp fish sauce\n- 600g pack chicken thigh fillets\n- ½ white cabbage (about 500g), thinly sliced\n- 1 large carrot, scrubbed and peeled into ribbons\n- 100g bunch spring onions, sliced\n- 200g rice stick noodles\n- 40g roasted unsalted peanuts, chopped\n- 15g fresh coriander, finely chopped\n- ½ tsp crushed chillies\n\nMETHOD\n1. Whisk together the lime juice, sugar, garlic, ginger, peanut butter, soy sauce, fish sauce and 100ml boiling water; pour into a 6.5ltr slow-cooker. Add the chicken thigh fillets, stir together and close the lid. Cook on high for 1 hr.\n2. Carefully remove the chicken and shred, keeping the lid of the slow-cooker closed so it retains the heat. Return the shredded chicken to the slow-cooker and add the cabbage, carrot and half the spring onions; cook for another 30 mins.\n3. Cook the noodles to pack instructions, then drain and rinse under cold water.\n4. Stir the noodles into the pad Thai with half the peanuts, coriander and crushed chillies. Divide between plates and top with the remaining spring onions, peanuts, coriander and crushed chillies, then serve with the lime wedges.\n\nNOTES\nTip: To cook in the oven, follow step 1 and cook in a lidded casserole dish at gas 2/150°C/fan 130°C for 1 hr. Continue with the remainder of the recipe(returning to the oven for a further 30 mins as per step 2).\n\ncooked it in the oven (not the slow cooker)\n\nSOURCE\nhttps://realfood.tesco.com/recipes/chicken-pad-thai.html\n"

    "text": "Chicken and Thyme Risotto\n\nPrep time: 25 minutes\nCook time: 30 minutes\nTotal time: 55 minutes\nServes: 4\n\nINGREDIENTS\n- 1 tbsp olive oil\n- 2 medium carrots, finely chopped\n- 1 small or half a large bulb fennel, finely chopped\n- 1 onion, finely chopped\n- Inner few ribs of a head of celery, including as many of the leaves as possible, finely chopped\n- 4 cups chicken stock (720ml)\n- Bundle of fresh thyme\n- 1 bay leaf\n- 2 skinless chicken breasts, in bite-sized pieces\n- 350g arborio risotto rice\n- 120ml Dry white wine\n- Salt and freshly ground pepper\n\n- Sauté setting\n\nMETHOD\n1. Press the SAUTÉ|SEAR button and then START|CANCEL to heat removable cooking bowl for 3 minutes with lid on.\n2. Remove lid, add oil and heat for 1 minute\n3. Add the chopped vegetables and stir. Cover and cook for at least 20 minutes, stirring occasionally, or until they're really soft and sweet, but be careful not to brown them too much.\n4. When the vegetables are well cooked, stir in the chicken and cook until opaque.\n5. Add rice, mix well, cover with lid and cook for 2–3 minutes, stirring occasionally.\n6. Stir in wine, and cook uncovered for 3 minutes or until all wine is absorbed.\n7. Press the START|CANCEL button to stop cooking. Risotto setting\n8. Stir in stock and throw in a few stems of thyme and the bay leaf. Cover with the lid, press the RISOTTO button and then START|CANCEL to start cooking.\n9. When it switches to the WARM setting, which will take about 20–30 minutes, remove the thyme and bay leaf, season, and add some fresh chopped thyme.\n"

    "filename": "Chorizo, chicken and chickpea casserole.txt",
    "text": "Chorizo, chicken and chickpea casserole\n\nPrep time: less than 30 mins\nCook time: 30 mins to 1 hour\nServes: 6\n\nINGREDIENTS\n- 2 tbsp vegetable oil\n- 500g chicken thighs\n- 1 onion, sliced\n- 1 garlic clove, sliced\n- 2 carrots, chopped\n- 1 celery stalk, chopped\n- 1 red chilli, deseeded and chopped\n- splash red wine\n- 275g chorizo, chopped\n- 100ml dry sherry\n- 1 x 400g can chopped tomatoes\n- 200ml chicken stock\n- 1 x 400g can chickpeas, rinsed and drained\n- salt and freshly ground black pepper\n- handful chopped fresh parsley\n- crusty bread, to serve\n\nMETHOD\n1. Heat half of the vegetable oil in a large pan. Add the chicken thighs and fry, turning frequently, until lightly browned all over. Remove from the pan and keep warm.\n2. Add a little more oil to the pan, then add the onion, garlic, carrots, celery and chilli and cook for five minutes. Add a splash of red wine and simmer until reduced by half.\n3. In another pan, heat the remaining oil and fry the chorizo for 2-3 minutes. Add the sherry and cook until the chorizo is crisp. Set aside.\n4. Add the can of chopped tomatoes to the pan with the vegetables and bring to the boil. Cook for five minutes, then add the stock and bring back to the boil.\n5. Add the browned chicken, the chickpeas and crisp chorizo and simmer for 20-25 minutes, or until the chicken is completely cooked through. Season, to taste, with salt and freshly ground black pepper.\n6. Sprinkle with chopped parsley and serve with crusty bread.\n\nNOTES\nlooks like the picture on the back of the One-pot Cooking.\n\nSOURCE\nBy Simon Rimmer From Something for the Weekend\nhttp://www.bbc.co.uk/food/recipes/chorizochickenandchi_87895\n"

    "filename": "Chorizo, pepper and couscous stuffed marrow.txt",
    "text": "Chorizo, pepper and couscous stuffed marrow\n\nServes: 4\nPrep time: less than 30 mins\nCook time: 30 mins to 1 hour\n\nINGREDIENTS\n- 1 large marrow, peeled\n- 100g/3oz couscous\n- 1 lemon, juice only\n- 2 tbsp olive oil\n- 1 red onion, finely sliced\n- 100g/3oz chorizo, cut into small chunks\n- 1 roasted red pepper, finely sliced\n- 2 vine ripened tomatoes, seeded and chopped\n- 1 tbsp parsley, roughly chopped\n- 1 tbsp mint, roughly chopped\n- 1 tbsp coriander, roughly chopped\n- salt and freshly ground black pepper\n\nMETHOD\n1. Preheat an oven to 200C/390F/Gas 6.\n2. Slice the marrow lengthways and scoop out all the seeds, then place on a roasting tray.\n3. Place the couscous in a bowl along with the lemon juice and enough boiling water to cover.\n4. Cover with cling film and allow to soak for five minutes.\n5. Meanwhile, heat a frying pan until hot then add the olive oil. Add the red onion and stir-fry for 3-4 minutes until just softened. Add the chorizo and fry for a further two minutes until just crisped and the juices are released. Add to the couscous, along with the pepper, tomatoes and herbs.\n6. Mix well and season to taste with salt and black pepper.\n7. Spoon into the centre of the two marrow halves.\n8. Place in the oven for 20 minutes and cook until piping hot and the marrow is just tender.\n9. To check if the marrow is done, place the tip of a knife into the side, if it offers just a little resistance it is done.\n\nSOURCE\nBBC Food Web Site\n"

    "text": "Serves 4\n\nINGREDIENTS\n- 15ml olive oil\n- 500g beef mince\n- 1 onion, chopped\n- 2 cloves garlic, crushed\n- 3 carrots, peeled and chopped\n- 30g plain flour\n- 400g can chopped tomatoes\n- 1 vegetable stock cube\n- 1kg potatoes, peeled\n- 40g unsalted butter\n- 300g frozen peas\n- salt\n- freshly ground black pepper\n\nMETHOD\n1. Heat the oil in a large frying pan, add the beef, onion and garlic, then sauté for 8mins or until golden brown. Stir in the carrots and flour and cook for 1 min.\n2. Add the tomatoes, stock cube and 300ml water. Season with salt and ground black pepper, then stir as the mixture comes to the boil. Cover and simmer for 40mins or until the meat is tender.\n3. Cook the potatoes in boiling salted water for 10-15mins or until tender. Drain the potatoes, return to the pan, then add the butter and mash until smooth and lump free. Season to taste.\n4. Spoon the meat mixture into a shallow dish, then top with the potatoes - fluff up the surface with a fork. Pop under a hot grill and cook for 2mins or until the top is golden brown. cook the peas in boiling water for 2-3mins, drain and serve with the cottage pie.\n\nNOTES\n15mins preparation + 1hr cooking time\n\nSOURCE\nhttp://www.tescorealfood.com/Recipes/Classic-cottage-pie.html\n"

    "filename": "Easy Bolognaise Sauce.txt",
    "text": "Easy Bolognaise Sauce\n\nINGREDIENTS\n- Makes 15 portions\n\n- 5tbsp olive oil\n- 4 onions, finely chopped\n- 4 carrots, chopped\n- 3 cloves garlic, crushed\n- 2kg minced beef (or 1kg minced beef and 1kg minced veal)\n- 500ml red wine\n- 4x400g tins chopped tomatoes\n- 500ml beef stock\n- 2tbsp granulated sugar\n- 200g tomato puree\n- 1tsp dried oregano\n- 8 sprigs thyme\n- 1tsp ground nutmeg\n\nMETHOD\n1. Heat the olive oil in a large saucepan and gently saute the onion and carrot for 8-10 minutes, or until tender and slightly coloured.\n2. Add the garlic and the minced meat and cook, stirring, until the meat starts to brown. Break up any lumps of meat with a fork.\n3. Add the red wine and cook, stirring frequently, for about 5 minutes until half of the wine has evaporated. Add the remaining ingredients. Simmer (uncovered), stirring occasionally, over low heat for 1.5 hours, or until reduced and slightly thickened. Season to taste.\n4. When the bolognaise has cooled, freeze into single or double-sized portions and keep for up to 3 months.\n\nNOTES\nHalved the quantities - produced six generous portions\n\nSOURCE\nRandom Magazine Article\n"

  {
    "title": "Fiery red rice salad",
    "category": "Savoury",
    "filename": "Fiery red rice salad.txt",
    "text": "Fiery red rice salad\n\nServes: 10\n\nINGREDIENTS\n- 450g/1lb Camargue red rice\n- 1 tsp salt\n- 6 carrots\n- 8 spring onions\n- small bunch coriander leaves, chopped\n\nFor the dressing:\n- 4 limes, finely grated zest and juice only\n- 4 tsp honey\n- 2 red chillies, finely chopped\n- 4 tbsp light olive oil\n- 2 tbsp cider vinegar\n- salt and pepper\n\nMETHOD\n1. Measure the rice in a jug, then place in a pan with double the volume of boiling water. 2. Add the salt. Bring to the boil, then cover and reduce the heat to a low simmer and cook for 20-30 minutes, or until the grains are tender but still have a little bite.\n3. Meanwhile, coarsely grate the carrots (use the thick grating blade of a food processor if you have one) and thinly slice the spring onions. Tip into a bowl and add half of the chopped coriander.\n4. For the dressing, make the dressing by mixing all the ingredients together in a jam jar and shake.\n5. Drain the rice if necessary and add to the bowl with the vegetables. Add the dressing, taste and season with more salt and pepper if necessary.\n6. Serve with the remaining coriander scattered on top.\n\nSOURCE\nhttp://www.bbc.co.uk/food/recipes/fiery_red_rice_salad_91889\n"

    "filename": "French Chicken with New Potatoes.txt",
    "text": "French chicken with new potatoes\n\nServes: 1\nPrep time: less than 30 mins\nCook time: 10 to 30 mins\n\nINGREDIENTS\n- 0.5 poussin\n- 4 tbsp butter\n- 0.5 onion, sliced\n- 3 tbsp fresh tarragon, chopped\n- 1 tbsp fresh rosemary leaves, chopped\n- 5 tbsp white wine\n- 70ml double cream\n- 150g cooked new potatoes\n- 3 tbsp butter, melted\n- salt and freshly ground black pepper\n\nMETHOD\n1. Preheat the oven to 200C/390F/Gas 6.\n2. Place the poussin on baking tray and cook for 10-15 minutes, or until cooked and golden.\n3. To make the sauce, melt the butter in a saucepan. Add the onion and soften for 2-3 minutes.\n4. Add the tarragon, rosemary, white wine and cream and reduce down for 4-5 minutes.\n5. For the new potatoes, mix the new potatoes with the melted butter and season.\n6. To serve, place the poussin on a serving plate and pour over the sauce. Serve with the new potatoes.\n\nNOTES\nUsing chicken breasts (skin on) instead of poussin. Doubled up quantities for two of us. Used 3tbsp dried tarragon.\n\nSOURCE\nBBC Food Web Site (James Martin)\n"

  {
    "title": "Goat's cheese and balsamic stuffed peppers",
    "category": "Savoury",
    "filename": "Goat's cheese and balsamic stuffed peppers.txt",
    "text": "Goat's cheese and balsamic stuffed peppers\n\nServes: 4\nPrep time: 20 minutes\nCook time: 55 minutes\n\nINGREDIENTS\n- Method: Oven/Hob\n\n- 4 large peppers;\n- 100g Tesco Cous Cous;\n- 100ml water boiling;\n- 1 tsp olive oil;\n- 1 medium red onion, finely chopped;\n- 3 tbsp balsamic vinegar;\n- 3 plum tomatoes. deseeded and diced; 20g fresh basil, finely chopped;\n- 60g soft goat's cheese\n\nMETHOD\n1. Preheat the oven to 200°C/Fan 180°C/Gas Mark 6.\n2. Slice the peppers in half lengthways through the stalks and then remove the seeds. Place on a baking tray and roast in the centre of the pre-heated oven for 30 minutes, until the peppers have softened.\n3. Meanwhile, mix the cous cous and water together in a medium sized bowl. Cover and leave to stand for 5 minutes, until all the water has been absorbed by the cous cous, then use a fork to separate the grains\n4. Heat the olive oil in a large frying pan over a low heat and fry the onion for 3 minutes until soft and translucent, then add the balsamic vinegar and fry for a further 3 minutes.\n5. Stir the onions, tomatoes and basil into the rehydrated cous cous until evenly mixed.\n6. Fill the peppers with the cous cous mixture, crumble the goat's cheese over the top and return to the oven for a further 15 minutes, until the goat's cheese has browned slightly. To serve: Serve with a crisp salad.\n\nSOURCE\nside of the couscous packet\n"

    "filename": "Halloumi and Butterbeans.txt",
    "text": "Halloumi and Butterbeans\n\nINGREDIENTS\n- 1 tbsp olive oil\n- 1 red onion, sliced\n- 2 garlic cloves, minced\n- 2 tsp smoked paprika\n- 1 tsp chili flakes\n- 1 tsp oregano\n- 1 jar (400g) roasted red peppers, sliced\n- 2 tins (800g) chopped tomatoes\n- 1 jar (600g) butter beans, drained\n- 1 packet (225g) halloumi, sliced\n- 2 large handfuls fresh spinach\n\nMETHOD\n1. Preheat oven to 180°C (350°F).\n2. Heat olive oil in an oven-safe pan over medium heat. Sauté onion for 8 minutes.\n3. Add garlic, paprika, chili flakes, and oregano; cook briefly.\n4. Stir in peppers and tomatoes; simmer for a few minutes.\n5. Mix in butter beans and top with halloumi slices.\n6. Bake for 20 minutes.\n7. Stir in spinach and let it wilt before serving.\n"

    "title": "Homemade tandoori chicken",
    "category": "Savoury",
    "filename": "Homemade tandoori chicken.txt",
    "text": "Homemade tandoori chicken\n\nPrep time: Overnight\nCook time: 30 mins to 1 hour\nServes: 4\n\nINGREDIENTS\nFor the chicken:\n- 1.75kg/4lbs chicken drumsticks, skinned\n- pinch salt\n- 2 lemons, juice only\n- 500g/1lb 2oz plain yoghurt\n- 3-4 tbsp tandoori spice mix\n\nFor the dip:\n- 3-4 tbsps plain yoghurt\n- pinch salt\n- pinch sugar\n- 5 fresh mint sprigs\n- 1 green chilli, deseeded, sliced\n\n- Preparation method\n\nMETHOD\n1. Cut deep incisions into the chicken flesh with a small, sharp knife. Place the chicken into a bowl and sprinkle over the salt and the juice of two lemons, massaging into the chicken until well coated.\n2. Whisk the yoghurt and tandoori spice mix in a bowl until well combined. Pour the marinade onto the chicken and massage into the flesh. Cover with clingfilm and chill in the fridge overnight.\n3. Preheat the grill to high.\n4. Lift the drumsticks from the tandoori mixture and gently shake off any excess. Place a wire rack over a roasting tin and lay the drumsticks upon it. Grill for 20 minutes, turning regularly, or until richly burnished and the chicken is cooked through. Add more lemon juice to taste.\n5. For the dip, place all of the ingredients into a food processor and blend until smooth. Serve alongside the chicken drumsticks.\n\nSOURCE\nBBC Food http://www.bbc.co.uk/food/recipes/homemade_tandoori_63396\n"

    "title": "Irish Stew",
    "category": "Savoury",
    "filename": "Irish Stew.txt",
    "text": "Irish Stew\n\nServes: 4\n\nINGREDIENTS\n- 675g middle neck of lamb, cut into cubes\n- 100g unsalted butter\n- 4 sliced onions\n- 450g potatoes, peeled and diced\n- 1 clove of garlic\n- 1 bouquet garni\n- 1.5 litres lamb stock\n- 175g sliced carrots\n- 6 celery sticks\n- 225g Savoy cabbage, shredded\n- salt and pepper\n- chopped parsley, to garnish\n\nMETHOD\n1. Cover the meat with cold water in a large pan and bring to the boil. Drain off the water and refresh the meat in cold water. Drain well. Melt the butter in a large braising pan and add the sliced onions, half the diced potatoes and the garlic. Add the bouquet garni to the pan and sweat for 2 minutes. Add the lamb and cover with the stock. Bring to the simmer, cover and cook for 30 minutes. The meat will be half-cooked and the potatoes will be starting to thicken the sauce. Add the carrots and continue to cook for a further 10 minutes. Add the remaining potatoes and the diced celery and cook for 15-20 minutes. Add the shredded cabbage and cook for another 2-3 minutes until the meat and the vegetables are tender. Season with the salt and pepper, remove the bouquet garni, garnish with parsley and serve.\n\nNOTES\n\nHaven't made it yet!\n\nSOURCE\n\"Style Magazine\", March 2003 (p.49)\n"

    "title": "Lamb Cannelloni",
    "category": "Savoury",
    "filename": "Lamb Cannelloni.txt",
    "text": "Lamb Cannelloni\n\nServes: 4-6\n\nINGREDIENTS\n- 450g/1lb lamb mince\n- 1 onion, peeled, sliced\n- 1 garlic clove, peeled, crushed\n- 2 tbsp tomato puree\n- 1 tsp cinnamon\n\n- 1 tsp freshly grated nutmeg\n- 1 tbsp chopped fresh parsley\n- 1 tbsp chopped fresh mint\n- 1 red chili, finely chopped\n- 16 x 12cmx16cm/6inx8in lasagne sheets, blanched, drained\n\nFor the topping:\n- 125g/4.5oz ricotta\n- 125g/4.5oz Greek-style yoghurt\n- 4 free-range eggs\n- freshly grated nutmeg, to taste\n\nTo serve:\n- toasted pitta\n- hummus\n\nMETHOD\nRecipe needs work! Tesco pasta sheets too long and thin. Pasta sticks together when cooked - use oil? Topping too dry and not quite enough. Used 9in square dish. Less than 30 mins preparation time 10 to 30 mins cooking time\n1. Preheat the oven to 200C/400F/Gas 6.\n2. Fry the lamb mince in a frying pan over a medium heat, turning frequently, for 4-5 minutes, or until browned all over. Remove the lamb from the pan and set aside.\n3. Fry the onion and garlic in the frying pan used to brown the lamb for 4-5 minutes, or until softened.\n4. Stir in the cooked lamb and tomato puree and cook for a further 4-5 minutes. Stir in the spices and cook for a further 3-4 minutes, or until fragrant. Stir in the fresh herbs and chilli.\n5. Spoon some of lamb along the long edge of a sheet of pasta, roll the pasta up into a cylinder and place into a greased ovenproof dish. Repeat with the remaining lamb mince and pasta sheets.\n6. For the topping, mix the ricotta, Greek-style yoghurt and eggs together in a bowl until well combined. Spoon the mixture on top of the lamb rolls and season, to taste, with grated nutmeg.\n7. Bake in the oven for 15-20 minutes, or until the top in golden-brown.\n8. Serve with toasted pitta and hummus.\n\nSOURCE\nBBC Food http://www.bbc.co.uk/food/recipes/lambcannelloni_93726\n"

  {
    "title": "Lamb Steaks with White Bean Mash",
    "category": "Savoury",
    "filename": "Lamb Steaks with White Bean Mash.txt",
    "text": "Lamb Steaks with White Bean Mash\n\nServes: 4\nPrep time: 15 mins\nCook time: 20 minutes\n\nINGREDIENTS\n- 5 cloves garlic\n- 30 g fresh rosemary\n- 3 tbsp olive oil\n- 1 finely grated zest and juice of unwaxed lemon\n- 350 g Healthy Living lamb leg steaks\n- 820 g Cannellini Beans\n- 4 wholemeal pitta breads\n- 143 g French-style salad, to serve\n\nMETHOD\n1. Preheat the oven to Gas 1, 140 degreeC, (fan 120 degreeC). Peel 4 of the garlic cloves and put them whole in an ovenproof dish with half the rosemary, a pinch of salt and 0.5 tbsp of olive oil. Put in the oven for 20 mins to soften the garlic.\n2. Finely chop the rest of the rosemary, and peel and crush the remaining garlic clove. Put them in a bowl, add half the lemon zest and juice, season. Add 2 tbsp of the olive oil and mix well, then add the lamb to the marinade. Let this sit for 10 mins while you make the white bean mash.\n3. Drain the cannellini beans and put them in a pan over a medium heat to gently heat through. Remove the roasted garlic from the oven, discard the rosemary and mash the garlic with a fork, then add to the beans. Pour in the remaining 0.5 tbsp of olive oil with the rest of the lemon juice and zest. Mash together, season and keep warm while you cook the lamb.\n4. Preheat the grill to high. Put the lamb steaks on a grill pan and pour over any remaining marinade. Grill the lamb for about 5mins on one side, then turn over and grill for a further 5mins. Remove from the grill and allow them to rest while you warm the pitta breads under the grill.\n5. Serve the lamb with the bean mash, the warm pitta breads and salad leaves.\n\nSOURCE\nhttp://www.tescorealfood.com/Recipes/Lamb-steaks-with-white-bean-mash.html\n"
  },

    "title": "Macaroni cheese",
    "category": "Savoury",
    "filename": "Macaroni Cheese.txt",
    "text": "Macaroni cheese\n\nServes: 4  (5/6)\nTakes: about an hour\n\nINGREDIENTS\n- 250g/9oz macaroni  (313/375)\n- 40g/1½oz butter (50/60)\n- 40g/1½ plain flour (50/60)\n- 600ml/1pint 1½fl oz milk  (750/900)\n- 250g/9oz grated cheddar  (313/375)\n- 50g/2oz grated parmesan  (63/75)\n\n- Preparation method\n\nMETHOD\n1. Cook the macaroni in a large saucepan of boiling salted water for 8-10 minutes; drain well and set aside.\n2. Melt the butter over a medium heat in a saucepan slightly larger than that used for the macaroni. Add the flour and stir to form a roux, cooking for a few minutes.\n3. Gradually whisk in the milk, a little at a time. Cook for 10-15 minutes to a thickened and smooth sauce.\n4. Meanwhile, preheat the grill to hot.\n5. Remove the sauce from the hob, add 175g/6oz of the cheese and stir until the cheese is well combined and melted.\n6. Add the macaroni to the sauce and mix well. Transfer to a deep suitably-sized ovenproof dish.\n7. Sprinkle over the remaining cheddar and the parmesan and place the dish under the hot grill. Cook until the cheese is browned and bubbling. Serve straightaway.\n\nSOURCE\nbbc.co.uk/food/recipes\n\n\n\nMacaroni cheese with cornflour\n300g pasta\n700 milk\n35 cornflour\n200 extra mature cheddar\n30 Parmesan\n"

  {
    "title": "Mustard Chicken With Chickpeas",
    "category": "Savoury",
    "filename": "Mustard Chicken With Chickpeas.txt",
    "text": "Mustard Chicken With Chickpeas\n\nServes: 2\n\nINGREDIENTS\n- 1tsp Dijon mustard\n- 2tsp balsamic vinegar\n- 2tbsp olive oil\n- 2 cloves garlic, crushed\n- 4 chicken thighs (bones in)\n- 400g tin chickpeas\n- 2tbsp extra virgin olive oil\n- Juice and grated zest of 1 lemon\n- 3tbsp chopped parsley\n\nMETHOD\n1. Heat the oven to 220degC (gas mark 7). Combine the mustard, balsamic vinegar, olive oil and one clove of garlic and bush the chicken thighs with the mixture. Season well. If you have time, marinate the chicken in the mustard mixture for a couple of hours before cooking, as this will add to the flavour.\n2. Heat a frying pan over a medium heat and, when hot, add the chicken, skin side down. Sear for 3-4 minutes, then turn it over. Remove the pan from the heat and baste the chicken with any remaining marinade. If the frying an has a heatproof handle, transfer it to the heated over; otherwise, transfer the chicken and place in the oven. Roast for 15-20 minutes, or until the chicken is cooked and golden.\n3. While the chicken is cooking, drain and rinse the chickpeas. Place them, with the extra virgin olive oil, remaining garlic and the lemon juice and zest in a saucepan over a gentle heat and warm thoroughly. Season to taste with salt and freshly ground black pepper. Just before serving, stir the parsley through. Serve the warm chickpeas with the chicken.\n\nNOTES\n\"You can make this dish with chicken breast if you prefer white meat.\"\n\nSOURCE\nRandom Magazine Article\n"

    "title": "Plain Omelette",
    "category": "Savoury",
    "filename": "Plain Omelette.txt",
    "text": "Plain Omelette\n\nServes: 1\n\nINGREDIENTS\n- 3 Eggs\n- Salt\n- Pepper\n- 20g Butter\n\nMETHOD\n1. Break the eggs into a small bowl, add a teaspoon of cold water, salt and pepper and half of the butter. Beat them a little with a fork. Melt the rest of the butter in a small frying pan, or omelette pan if you have one. It will start to sizzle and then to foam; just as the butter starts to smell nutty, swoosh in the egg. Quickly stir the egg three or four times with the fork, it will start to set on the bottom of the pan. Lift the edge of the omelette nearest the handle with the fork, tilting the pan as you do, and gently flip one half of the omelette over the other. Slide out the finished omelette on to a warm plate.\n\nNOTES\n\nAdd grated cheese, ham and chopped parsley\n\nSOURCE\n\"Real Fast Food\", Nigel Slater (p.52)\n"

  {
    "title": "Potato and Bacon Gratin",
    "category": "Savoury",
    "filename": "Potato and Bacon Gratin.txt",
    "text": "Potato and Bacon Gratin\n\nServes: 2-4\n\nINGREDIENTS\n- 3 tbsp butter\n- 6 tbsp bechamel sauce\n- 500g potato, diced\n- Bacon\n- Gruyere chesse for topping\n\nMETHOD\n1. Heat the oven to 180ûC / 350ûF / Gas 4. Melt 2 tbsp butter in a pan. Add the potato and bacon, turning them until coated and the bacon is browned. Use the last tablespoonful of butter to grease a gratin dish, then add the bacon and potato and spread it out: it should be no more the two pieces deep, and loosely packed. Season generously with sea salt and black pepper, then drizzle over the bechamel sauce. Top with chees and bake for an hour, until well-browned.\n\nNOTES\nMany variations.\n1. Use 500g pumpkin, 2 sage leaves, chopped, and whipping cream.\n2. Tomato and courgette, sauteed with garlic in a wide pan until dryish, then baked with a scattering of breadcrumbs.\n3. Any vegetable. Sautee first to remove excess liquid. If using tomatoes precook other ingredients or allow extra time in oven as tomatoes harden the other veg. Moisten with stock, bechamel or cream. Top with breadcrumbs or cheese (add any toppings sparingly).\n\nSOURCE\nNewspaper\n"

  {
    "title": "Slow-cooker pumpkin and beef brisket chilli",
    "category": "Savoury",
    "filename": "Pumpkin and beef brisket chilli.txt",
    "text": "Slow-cooker pumpkin and beef brisket chilli\n\nServes: 8\nCalories: 394 per serving\n\nINGREDIENTS\n- 20 minutes to prepare and 9 hrs to cook\n\n- 1½ tbsp olive oil\n- 600g pumpkin, peeled, deseeded and cut into 2.5cm pieces\n- 1kg beef brisket, string removed, patted dry with kitchen paper\n- 2 onions, chopped\n- 1 red pepper, roughly chopped\n- 3 garlic cloves, crushed​\n- 1 tbsp smoked paprika​\n- 1 tsp ground cumin\n- 1 tsp fennel seeds, crushed\n- 1 tbsp tomato purée​\n- 75ml balsamic vinegar\n- 400g tin chopped tomatoes\n- 1 beef stock pot, made up to 500ml\n- 400g tin cannellini beans, drained​\n- rice, to serve (optional)\n- baked potato, to serve (optional)\n- grated mature Cheddar, to serve (optional)\n- 15g fresh coriander, leaves picked\n\n- beef brisket (my joint was just under 1kg) salt and pepper garlic oil\n- 4-6 carrots, chopped\n- 3-4 potatoes, chopped\n- 1-2 parsnips, chopped\n- 650ml gf stock\n- 4 tbsp red wine vinegar\n- 3 tbsp gf soy sauce half tsp thyme\n- 1 tsp garlic oil\n- 2 bay leaves\n- 2 tbsp tomato puree\n- 100g green beans\n\nMETHOD\n1. Heat 1 tbsp oil in a large frying pan over a medium-high heat and fry the pumpkin for 12-15 mins, tossing regularly, until browned. Tip into a bowl and set aside to cool; cover.\n2. Season the beef brisket all over and place in the frying pan, fat-side down, for 12 mins, turning occasionally, until browned all over. Transfer to a plate and set aside.\n3. Reduce the heat to medium, add the remaining oil and fry the onions and pepper for 5 mins, stirring regularly to scrape up any beef fat, until golden and caramelised. Add the garlic, spices and tomato purée and cook for 2 mins.\n4. Pour in the vinegar and allow to mostly cook away for 1 min.\n5. Tip into a 3.5ltr slow-cooker with the tinned tomatoes and stock. Add the brisket; cover and cook on low for 7 hrs.\n6. Uncover the chilli and stir through the beans and pumpkin. Cover and cook for a further 1 hr 30 mins.\n7. Shred the beef with 2 forks; season to taste. Serve with rice or baked potatoes and grated cheese, if you like, and scatter with the coriander to serve.\n1) Season the beef with salt and pepper, then sear either in the slow cooker pan on the hob or a separate pan in a little garlic oil until sealed and coloured on all sides.\n2) Place the carrots, potatoes and parsnips into the slow cooker, followed by the beef and all the other ingredients except the green beans.\n3) Lid on and then cook on high for about 6 hours or low for closer to 8 hours.\n4) 30 minutes before it finishes, add in the green beans to cook through.\n5) To make the gravy bring all the juices to the boil and stir through cornflour mixed with a little water (1.5 tbsp cornflour mixed with 3 tbsp water), keep stirring and then simmer until it thickens to your liking facebook.com\n\nNOTES\nwe did about 3/4 to fit it in the slow cooker (800g beef, 500g pumpkin)\n\nSOURCE\nhttps://realfood.tesco.com/recipes/slow-cooker-pumpkin-beef-brisket-chilli.html\n"

  {
    "title": "Risotto with Butternut Squash, Gorgonzola and Toasted Pecans",
    "category": "Savoury/Risottos",
    "filename": "Butternut Squash and Gorgonzola Risotto.txt",
    "text": "Risotto with Butternut Squash, Gorgonzola and Toasted Pecans\n\nServes: Makes 4 servings\n\nINGREDIENTS\n- 4 cups low-sodium chicken or vegetable stock\n- 2 tablespoons extra-virgin olive oil\n- 1/2 small onion , finely chopped\n- 1 cup arborio rice\n- 2 cloves small garlic , finely chopped\n- 1 medium butternut squash (about 1 1/2 pounds), peeled, seeded, and cut into 1/2-inch cubes\n- 8 large sage leaves , chopped\n- 2 tablespoons butter\n- 2 teaspoons salt\n- Freshly ground pepper\n- 1/3 cup crumbled Gorgonzola\n- 1/4 cup chopped toasted pecans\n\nMETHOD\n1. In a saucepan, bring the stock to a boil. Then reduce heat to low.\n2. In a large, heavy-bottomed saucepan over a medium-high flame, heat the olive oil. Add the onion. Sauté for 2 minutes, stirring constantly. Add the rice; stir until well coated, about 1 minute. Add the garlic and squash and continue to stir another 30 seconds. Lower the heat to medium and add 1/2 cup hot stock. With a wooden spoon, stir until the liquid is absorbed but the rice isn't sticking to the pan. Continue adding 1/2 cup stock and stirring until the stock is absorbed, about 20 to 25 minutes, or until the rice is tender.\n3. Remove from heat; add the sage, butter, and salt. Season with pepper. Stir to combine. Place risotto in a serving bowl and top with Gorgonzola and pecans.\n\nNOTES\n\nRecommended variations\n\n* Cranberry Risotto: Add 1/2 cup dried cranberries with the garlic and squash.\n* Barley Risotto: Substitute one cup barley for the arborio rice and use one additional cup of stock. Barley has a nuttier taste and a less creamy texture than rice.\n* Indian-Spiced Risotto with Shrimp: Omit the squash and add one teaspoon cumin, 2 teaspoons curry powder, and 1/4 teaspoon red pepper flakes. When the rice is about two-thirds done, add 1 1/2 pounds medium-size peeled and deveined shrimp. Continue cooking until the rice and shrimp are cooked through. Finally, substitute 2 tablespoons chopped cilantro for the sage, omit the Gorgonzola, and increase the amount of butter to 4 tablespoons.\n\nSOURCE\nDecember 2003 issue of O, The Oprah Magazine\n"
  },
  {
    "title": "Butternut Squash and Bacon Risotto",
    "category": "Savoury/Risottos",
    "filename": "Butternut Squash and Bacon Risotto.txt",
    "text": "Butternut Squash and Bacon Risotto\n\nINGREDIENTS\n- 1kg butternut squash, peeled and cut into bite­size chunks (I didn’t weigh, just used 1 butternut squash)\n- 1­-2 tbsp olive oil\n- 900 ml vegetable stock\n- 50g butter or 1 tbsp olive oil\n- 1 onion\n- 300g risotto rice\n- 1 small glass white wine\n- 50g parmesan\n- 180g Tesco Finest Smoked Pancetta sliced but bacon would be fine\n\nMETHOD\n1. Before you make the risotto, heat oven to fan 200C. Toss the squash in 1 tbsp oil. Scatter into a shallow roasting tin and roast for 20-30 mins until it is brown and soft.\n2. While the squash is roasting, prepare the risotto in the risotto maker. Saute setting lid on 3 min.\n3. Add half the butter or a tbsp oil and leave for 1 min with lid on.\n4. Stir in the onions and pancetta and sweat gently for 8-­10 mins until soft but not coloured, stirring occasionally.\n5. Stir the rice into the onions until completely coated in the oil, leave for 2­-3 min with lid on, stirring occasionally.\n6. Pour in the wine and simmer with lid off until totally evaporated (3 min).\n7. Add the stock and start risotto function.\n8. When the squash is cooked, mash it to a rough puree.\n9. When the risotto is just done, stir though the puree, then add the cheese and butter and leave to rest for a few mins.\n\nSOURCE\nhttps://www.bbcgoodfood.com/recipes/7767/butternut-squash-and-sage-risotto but omit sage and add bacon when cooking onions\n"
  },
  {
    "title": "Chicken and Chorizo Risotto",
    "category": "Savoury/Risottos",
    "filename": "Chicken and Chorizo Risotto.txt",
    "text": "Chicken and Chorizo Risotto\n\nServes: 6\n\nINGREDIENTS\n- Olive oil\n- 200g chorizo sausage, diced\n- 650g chicken breast or thigh, diced\n- 1.5 onion, diced\n- 4 cloves garlic, minced\n- 300 g arborio rice\n- 150ml white wine\n- 2 cans diced tomatoes\n- 600ml chicken stock\n- 2 tsp smoked paprika\n- 1 tsp red chilli flakes\n- 60g parmesan, grated\n- fresh parsley, chopped\n\n- Sauté setting\n\nMETHOD\n1. Press the SAUTÉ|SEAR button and then START|CANCEL to heat removable cooking bowl for 3 minutes with lid on.\n2. Remove lid, add oil, heat for 1 minute.\n3. Add the onion, cover with lid and cook, stirring occasionally for 3 minutes, until onion has softened.\n4. Add the sliced chorizo, chilli flakes and paprika and cook until browned and crispy. Add the diced chicken and garlic and cook until the chicken is browned on all sides.\n5. Add rice, mix well, cover with lid and cook for 2–3 minutes, stirring occasionally.\n6. Stir in wine, and cook uncovered for 3 minutes or until all wine is absorbed.\n7. Press the START|CANCEL button to stop cooking. Risotto setting\n8. Stir in tomatoes and stock, cover with the lid, press the RISOTTO button and then START|CANCEL to start cooking.\n9. When it switches to the KEEP WARM setting, which will take about 20–30 minutes, remove the lid and stir through grated parmesan cheese and parsley. Cover and leave on WARM for 5 minutes.\n\nSOURCE\nAvalon\n"
  },
  {
    "title": "Chicken and Thyme Risotto",
    "category": "Savoury/Risottos",
    "filename": "Chicken Risotto.txt",
    "text": "Chicken and Thyme Risotto\n\nPrep time: 25 minutes\nCook time: 30 minutes\nTotal time: 55 minutes\nServes: 4\nServes: 6\n\nINGREDIENTS\n- 1 tbsp olive oil\n- 2 medium carrots, finely chopped\n- 1 small or half a large bulb fennel, finely chopped\n- 1 onion, finely chopped\n- Inner few ribs of a head of celery, including as many of the leaves as possible, finely chopped\n- 1 litre chicken stock\n- Bundle of fresh thyme\n- 1 bay leaf\n- 600g diced chicken\n- 350g arborio risotto rice\n- 150ml French vermouth such as Noilly Prat\n- Salt and freshly ground pepper\n\nMETHOD\n1. Heat the oil over a low heat in a large, heavy pan with a lid, add the chopped vegetables and stir. Cover and cook for at least 20 minutes, stirring occasionally, or until they're really soft and sweet, but be careful not to brown them too much. Meanwhile, heat the chicken stock in a small pan, and throw in a few stems of thyme and the bay leaf. Keep it warm on a very low heat.\n2. When the vegetables are well cooked, stir in the chicken and cook until opaque. Add the risotto rice and stir well to coat it in the oil. Add half the vermouth and stir until the liquid has almost evaporated, then add a ladleful of the stock and cook, stirring, until the rice has absorbed it. Continue adding the stock, ladleful by ladleful, letting the rice absorb each addition, and stirring all the time to release the starches from the rice. When the rice is almost cooked, after about 18 minutes, remove the thyme and bay leaf, season, and add some fresh chopped thyme. Take the pan from the heat, stir in the rest of the vermouth and serve straight away. Experimental recipe: add lemon, chickpeas, parmesan, no fennel For 10: 2.5 tbsp olive oil 5 medium carrots, finely chopped 2.5 small or 1.5 a large bulb fennel, finely chopped 2.5 onion, finely chopped Inner few ribs of a head of celery, including as many of the leaves as possible, finely chopped 2.5 litre chicken stock Bundle of fresh thyme 2.5 bay leaf 5 s nnel seeds and cook for 1 min until fragrant. Add the onion, fennel (reserving the fronds) and garlic and cook for 4 mins until beginning to turn translucent. Return the sausage meat to the dish.\nMeanwhile, warm 1.5ltrs stock in a saucepan over a low heat.\nAdd the rice to the casserole dish and toast for 2 mins, stirring, then add the wine or extra stock, and use a wooden spoon to scrape any stuck bits from the bottom of the pan. Reduce the heat to low. Add the warm stock, 2 ladlefuls at a time, allowing the rice to completely absorb the liquid before adding more. Cook for 26-28 mins, stirring regularly, until the rice is cooked through.\nRemove from the heat and add 55g pecorino and a crack of black pepper, then cover and leave to rest for 2 mins. Transfer half (about 1kg) to a bowl, allow to cool for a maximum of 30 mins, then cover and transfer to the fridge for up to 24 hrs to use in the Mediterranean stuffed peppers (see tip, below).\nDivide the risotto between bowls, top with the remaining pecorino, the fennel fronds and another crack of black pepper. Serve immediately.\n"

    "text": "Risotto with sausage and red wine\n\nServes: 4\n\nINGREDIENTS\n- 2 1/4 pints  chicken, beef or veal stock 5.6\n- 60g butter 150\n- 1 large brown onion, peeled and chopped 2.5\n- 400g Good quality sausages, meat removed from casings 1kg\n- 250g Risotto rice 625\n- 120ml red wine 300ml\n- handful chopped flat leaf parsley\n- 60g freshly grated parmesan 150\n- salt and pepper\n\nMETHOD\n1. Bring the stock to a gentle simmer in a large saucepan. Meanwhile, heat 40g of the butter in a large, heavy-based saucepan. Add the onion and cook, stirring, over a moderate heat for 3 minutes. Turn up the heat a little and add the meat. Cook, stirring, until it colours, breaking up any lumps with a fork. Add the rice and stir gently for 2 minutes. Add the wine, stir, and allow most of the liquid to evaporate. Add the stock, a ladleful at a time, to the rice mixture. Stir frequently and add more stock as it is absorbed. The rice will take 18-25 minutes to cook - when ready it should be soft but retain bite. If the stock runs out before the rice is cooked, continue with simmering water. Remove from the heat and add the parsley, parmesan and the remaining butter. Season to taste. Cover and allow to rest for 5 minutes before serving.\n\nNOTES\n\nUsed chicken stock. Rice took about 22 minutes after starting to add the stock.\n\nRisotto plus settings\n\n4 cups chicken, beef or veal stock\n60g butter\n1 large brown onion, peeled and chopped\n400g Good quality sausages, meat removed from casings\n250g Risotto rice\n120ml red wine\nhandful chopped flat leaf parsley\n60g freshly grated parmesan\nsalt and pepper\n\nSauté setting\n1. Press the SAUTÉ|SEAR button and then START|CANCEL to heat removable cooking bowl for 3 minutes with lid on.\n2. Remove lid, 40g butter, heat for 1 minute or until butter has melted.\n3. Add the onion, cover with lid and cook, stirring occasionally for 3 minutes, until onion has softened.\n4. Add the meat. Cook, stirring, until it colours, breaking up any lumps with a fork.\n5. Add rice, mix well, cover with lid and cook for 2–3 minutes, stirring occasionally.\n6. Stir in wine, and cook uncovered for 3 minutes or until all wine is absorbed.\n7. Press the START|CANCEL button to stop cooking.\n\nRisotto setting\n8. Stir in stock, cover with the lid, press the RISOTTO button and then START|CANCEL to start cooking.\n9. When it switches to the KEEP WARM setting, which will take about 20–30 minutes, remove the lid and stir through grated parmesan cheese, remaining butter and parsley. Cover and leave on WARM for 5 minutes.\n\nSOURCE\nSainsbury Magazine, Autumn 2003, p. 64\n"

  {
    "title": "Roasted Marmalade Ham",
    "category": "Savoury",
    "filename": "Roasted Marmalade Ham.txt",
    "text": "Roasted Marmalade Ham\n\nServes: 10 PLUS\n\nINGREDIENTS\n- 3-4kg/7-8½lb middle cut gammon with the knuckle left on\n- 2 carrots, roughly chopped\n- 2 sticks of celery, roughly chopped\n- 2 bay leaves\n- 16 black peppercorns\n- 1 bouquet garni (a piece of leek, celery, a bay leaf, a sprig of fresh thyme)\n- 2 oranges\n- 2 tablespoons sea salt\n- 3 tablespoons freshly ground black pepper\n- 1 jar of best thin-rind marmalade\n- a handful of fresh rosemary, leaves picked\n\nMETHOD\n1. First of all you want to place the gammon in a large but snug-fitting pot. Cover it with water, then throw in your veg, bay leaves, peppercorns and bouquet garni. Peel the zest from the oranges and add to the water, then squeeze the juice in and add the salt.\n2. Bring to the boil, then turn the heat down and simmer for an hour and a quarter with a lid on, skimming when need be.\n3. Remove from the heat and allow to cool for half an hour in the broth. This will allow the flavours to really penetrate the meat. Discard the vegetables from the broth, but keep the broth for making minestrone-type soups - it will freeze well for use another day.\n4. Preheat the oven to 170°C/325°F/gas 3. Carefully remove the meat to a board and, using a knife, take off the skin. Depending on the breed and quality of the pig, you should have a nice layer of fat. Remove some of the fat as well, to leave you with about 1cm/½ inch. The extra fat can be kept in the freezer for roasting with potatoes another time.\n5. Score the fat left on the meat in a crisscross fashion, and while it's moist, season it generously with the ground black pepper. Place the meat in a roasting tray and roast for 20 minutes until the fat renders and becomes slightly crispy.\n6. Remove from the oven, stir up the marmalade to loosen, then smear and rub it all over the meat with the rosemary. Place back in the oven for about 1 hour and baste frequently until beautifully golden and crisp.\n7. Serve as you would a roast dinner or as part of a picnic.\n\nSOURCE\nJamie’s book\n"

    "filename": "Curried Lamb with Apples and Bananas.txt",
    "text": "Curried Lamb with Apples and Bananas\n\nServes: 6-8\n\nINGREDIENTS\n- 1tbsp cumin seeds\n- 1 tsp coriander seeds\n- 1 tbsp olive oil (approx.)\n- 1kg trimmed stewing lamb, cut into 1-inch (2.5 cm) cubes\n- 2 onions, finely chopped\n- 4 cloves garlic, minced\n- 1 tbsp minced gingerroot\n- 2 tsp turmeric\n- 1 cinnamon stick piece (2 inches/5 cm)\n- 2 black cardamom pods, crushed\n- 0.5 tsp cracked black peppercorns\n- 1 cup beef or chicken stock\n- 1 or 2 long red or green chile peppers, minced, or 1/4 tsp (1 mL) cayenne dissolved in 1 tbsp (15 mL) boiling water\n- 3 apples, peeled, cored and thinly sliced\n- 2 bananas/plantains , thinly sliced\n- 0.25 cup finely chopped cilantro or parsley leaves\n\nMETHOD\n1. Press the SAUTE/SEAR button and then the START/CANCEL button. Heat removable cooking bowl for 3 minutes with the lid on.\n2. Add half the oil and heat for 1 minute.\n3. Add lamb in small batches and cook until lightly browned; remove and set aside.\n4. Add onions to pan and cook, stirring, until softened, about 3 minutes.\n5. Add garlic, gingerroot, turmeric, cinnamon stick, cardamom, peppercorns and reserved cumin and coriander and cook, stirring, until spices release their aroma, about 1 minute.\n6. Return lamb to removable cooking bowl and add stock; mix well.\n7. Press START/CANCEL button to end the saute setting.\n8. Cover with lid. Press the SLOW COOK HIGH BUTTON and then the START/CANCEL button. Cook for 3-4 hours or select SLOW COOK LOW setting for 5-6 hours.\n9. Discard cinnamon stick and cardamom pods. Add chile peppers, apples and bananas, in batches, stirring to incorporate each batch before adding the next. Cover and cook on HIGH for 30 minutes, until fruit is tender and hot. Garnish with cilantro.\n9. Serve with brown basmati rice.\n"
