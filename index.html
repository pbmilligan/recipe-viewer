  <script>
    (() => {
      "use strict";

      const fileInput = document.getElementById("file-input");
      const searchInput = document.getElementById("search-input");
      const recipeIndex = document.getElementById("recipe-index");
      const recipeView = document.getElementById("recipe-view");
      const selectionBar = document.getElementById("selection-bar");
      const backButton = document.getElementById("back-button");
      const resultCount = document.getElementById("result-count");
      const searchHint = document.getElementById("search-hint");
      const scopeButtons = Array.from(document.querySelectorAll(".scope-button"));
      const sectionLabels = new Map([["INGREDIENTS", "ingredients"], ["METHOD", "method"], ["NOTES", "notes"], ["SOURCE", "source"]]);
      const metadataLabels = new Set(["serves", "serving", "servings", "prep time", "cook time", "total time", "calories", "yield", "takes"]);
      const embeddedRecipes = JSON.parse(document.getElementById("recipe-data").textContent);
      const recipes = embeddedRecipes.map((record, index) => ({ ...record, id: `saved-${index}` }));
      let searchScope = "all";
      let selectedRecipeId = null;
      let nextUploadId = 0;

      function normalized(text) {
        return text.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
      }

      function parseRecipe(text, fallbackTitle) {
        const original = text;
        const lines = normalized(text).split("\n");
        const titleIndex = lines.findIndex((line) => line.trim());
        if (titleIndex < 0) return { formatted: false, title: fallbackTitle, raw: original, details: [], sections: {} };
        let title = lines[titleIndex].trim();
        if (sectionLabels.has(title.toUpperCase()) || /^https?:\/\//i.test(title)) title = fallbackTitle;
        let section = "intro";
        let sawIngredients = false;
        let sawMethod = false;
        const details = [];
        const sections = { ingredients: [], method: [], notes: [], source: [], intro: [] };

        for (const line of lines.slice(titleIndex + 1)) {
          const trimmed = line.trim();
          const label = sectionLabels.get(trimmed.toUpperCase());
          if (label) {
            section = label;
            if (label === "ingredients") sawIngredients = true;
            if (label === "method") sawMethod = true;
            continue;
          }
          if (section === "intro" && trimmed) {
            const detail = trimmed.match(/^([^:]+):\s*(.*)$/);
            if (detail && metadataLabels.has(detail[1].trim().toLowerCase())) {
              details.push({ label: detail[1].trim(), value: detail[2].trim() });
              continue;
            }
          }
          sections[section].push(line);
        }

        const formatted = (sawIngredients && sections.ingredients.some((line) => line.trim())) ||
          (sawMethod && sections.method.some((line) => line.trim()));
        return { formatted, title, raw: original, details, sections };
      }

      function ingredientText(recipe) {
        const parsed = parseRecipe(recipe.text, recipe.title);
        if (parsed.formatted) return parsed.sections.ingredients.join("\n");
        const lines = normalized(recipe.text).split("\n");
        const start = lines.findIndex((line) => /^\s*ingredients?\s*:?\s*$/i.test(line));
        if (start >= 0) {
          const end = lines.findIndex((line, index) => index > start && /^\s*(?:method|directions|instructions|preparation|steps?)\s*:?\s*$/i.test(line));
          return lines.slice(start + 1, end < 0 ? lines.length : end).join("\n");
        }
        const firstStep = lines.findIndex((line, index) => index > 0 && /^\s*(?:step\s*)?\d+[.)]\s+/i.test(line));
        if (firstStep > 1) {
          return lines.slice(1, firstStep).filter((line) => !/^\s*(?:serves?|prep(?:aration)?\s*time|cook(?:ing)?\s*time|total\s*time|calories?|yield)\b/i.test(line)).join("\n");
        }
        return "";
      }

      function element(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function renderIndex() {
        if (selectedRecipeId !== null) return;
        recipeIndex.replaceChildren();
        const query = searchInput.value.trim().toLocaleLowerCase();
        const matching = recipes.filter((recipe) => {
          const searchable = searchScope === "ingredients"
            ? ingredientText(recipe)
            : `${recipe.title}\n${recipe.category}\n${recipe.filename || ""}\n${recipe.text}`;
          return !query || searchable.toLocaleLowerCase().includes(query);
        }).sort((a, b) => a.title.localeCompare(b.title));
        const label = searchScope === "ingredients" ? "Searches ingredients only" : "Searches all recipe text";
        searchHint.textContent = label;
        resultCount.textContent = `${matching.length} of ${recipes.length} ${recipes.length === 1 ? "recipe" : "recipes"}`;

        if (!matching.length) {
          recipeIndex.append(element("div", "list-empty", query ? "No recipes match that search." : "No recipes are available."));
          return;
        }
        for (const recipe of matching) {
          const button = element("button", "recipe-row");
          button.type = "button";
          button.setAttribute("aria-label", `Open ${recipe.title}`);
          button.append(element("span", "row-title", recipe.title));
          button.append(element("span", "row-category", recipe.category || "Recipe"));
          button.append(element("span", "row-arrow", "→"));
          button.addEventListener("click", () => selectRecipe(recipe.id));
          recipeIndex.append(button);
        }
      }

      function renderIngredientSection(parent, lines) {
        const section = element("section", "recipe-section");
        section.append(element("h3", "section-title", "Ingredients"));
        const list = element("ul", "ingredient-list");
        let count = 0;
        for (const line of lines) {
          const clean = line.trim();
          if (!clean || /^[-*•]\s*$/.test(clean)) continue;
          if (/^[^\n]+:$/.test(clean) && !/^[-*•]\s/.test(clean)) {
            section.append(element("p", "ingredient-group", clean.replace(/:$/, "")));
            continue;
          }
          const item = element("li", "ingredient-item");
          item.append(element("span", "", clean.replace(/^[-*•]\s*/, "")));
          list.append(item);
          count += 1;
        }
        if (count) section.append(list);
        parent.append(section);
      }

      function methodParagraphs(lines) {
        const hasSteps = lines.some((line) => /^\s*(?:step\s*)?\d+[.)]\s+/i.test(line));
        const paragraphs = [];
        let current = [];
        let currentStep = false;
        const flush = () => {
          const text = current.join(" ").trim();
          if (text) paragraphs.push({ text, step: currentStep });
          current = [];
          currentStep = false;
        };
        for (const line of lines) {
          const clean = line.trim();
          const numbered = clean.match(/^(?:step\s*)?\d+[.)]\s*(.*)$/i);
          if (!clean) {
            if (!hasSteps) flush();
            continue;
          }
          if (numbered) {
            flush();
            current = [numbered[1]];
            currentStep = true;
          } else {
            current.push(clean);
          }
        }
        flush();
        return paragraphs;
      }

      function renderMethodSection(parent, lines) {
        const section = element("section", "recipe-section");
        section.append(element("h3", "section-title", "Method"));
        const list = element("ol", "method-list");
        for (const paragraph of methodParagraphs(lines)) {
          const item = element("li", "method-item", paragraph.text);
          if (!paragraph.step) item.classList.add("method-preface");
          list.append(item);
        }
        if (list.childElementCount) section.append(list);
        parent.append(section);
      }

      function renderCard(recipe, parsed) {
        const card = element("article", "recipe-card");
        const header = element("header", "recipe-header");
        header.append(element("p", "recipe-kicker", recipe.category || "Recipe"));
        header.append(element("h2", "recipe-title", parsed.title));
        if (parsed.details.length) {
          const details = element("div", "details");
          for (const detail of parsed.details) details.append(element("span", "detail-chip", `${detail.label}: ${detail.value}`));
          header.append(details);
        }
        const body = element("div", "recipe-body");
        const hasIngredients = parsed.sections.ingredients.some((line) => line.trim());
        const hasMethod = parsed.sections.method.some((line) => line.trim());
        if (hasIngredients) {
          const ingredients = element("div", "ingredients-panel");
          renderIngredientSection(ingredients, parsed.sections.ingredients);
          body.append(ingredients);
        }
        if (hasMethod) {
          const method = element("div", "method-panel");
          renderMethodSection(method, parsed.sections.method);
          body.append(method);
        }
        if (!hasMethod) {
          body.classList.add("ingredients-only");
        } else if (!hasIngredients) {
          body.classList.add("method-only");
        }
        card.append(header, body);
        for (const [key, label] of [["notes", "Notes"], ["source", "Source"]]) {
          const text = parsed.sections[key].map((line) => line.trim()).filter(Boolean).join("\n");
          if (!text) continue;
          const block = element("section", "note-block");
          block.append(element("h3", "section-title", label));
          block.append(element("p", `note-text${key === "source" ? " source-text" : ""}`, text));
          const footer = element("div", "notes-source");
          footer.append(block);
          card.append(footer);
        }
        return card;
      }

      function renderOriginalText(recipe) {
        const disclosure = element("details", "original-disclosure");
        disclosure.append(element("summary", "", "Show original text"));
        disclosure.append(element("pre", "original-text", recipe.text));
        return disclosure;
      }

      function renderSelected() {
        recipeIndex.hidden = selectedRecipeId !== null;
        selectionBar.hidden = selectedRecipeId === null;
        recipeView.hidden = selectedRecipeId === null;
        recipeView.replaceChildren();
        if (selectedRecipeId === null) {
          renderIndex();
          return;
        }
        const recipe = recipes.find((item) => item.id === selectedRecipeId);
        if (!recipe) {
          selectedRecipeId = null;
          renderSelected();
          return;
        }
        const parsed = parseRecipe(recipe.text, recipe.title);
        if (parsed.formatted) {
          recipeView.append(renderCard(recipe, parsed));
          recipeView.append(renderOriginalText(recipe));
        } else {
          const card = element("article", "recipe-card plain-recipe");
          card.append(element("p", "recipe-kicker", recipe.category || "Original text"));
          card.append(element("pre", "plain-text", recipe.text));
          recipeView.append(card);
        }
        resultCount.textContent = `Viewing 1 of ${recipes.length}`;
        searchHint.textContent = "One recipe selected";
      }

      function selectRecipe(id) {
        selectedRecipeId = id;
        renderSelected();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function addFiles(fileList) {
        const files = Array.from(fileList || []).filter((file) => /\.(txt|text|md)$/i.test(file.name) || file.type === "text/plain");
        for (const file of files) {
          const reader = new FileReader();
          reader.onload = () => {
            const text = String(reader.result || "");
            const firstLine = normalized(text).split("\n").find((line) => line.trim()) || file.name.replace(/\.[^.]+$/, "");
            const recipe = { id: `upload-${nextUploadId++}`, title: firstLine.trim(), category: "Uploaded", text };
            recipes.push(recipe);
            if (selectedRecipeId !== null) renderSelected();
            else renderIndex();
          };
          reader.readAsText(file);
        }
        fileInput.value = "";
      }

      scopeButtons.forEach((button) => button.addEventListener("click", () => {
        searchScope = button.dataset.scope;
        scopeButtons.forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
        renderIndex();
      }));
      searchInput.addEventListener("input", renderIndex);
      backButton.addEventListener("click", () => {
        selectedRecipeId = null;
        renderSelected();
      });
      fileInput.addEventListener("change", () => addFiles(fileInput.files));
      document.addEventListener("keydown", (event) => {
        if (event.altKey && event.shiftKey && event.key.toLowerCase() === "u") {
          event.preventDefault();
          fileInput.click();
        }
      });
      document.addEventListener("dragover", (event) => {
        if (Array.from(event.dataTransfer?.types || []).includes("Files")) event.preventDefault();
      });
      document.addEventListener("drop", (event) => {
        if (!Array.from(event.dataTransfer?.types || []).includes("Files")) return;
        event.preventDefault();
        addFiles(event.dataTransfer.files);
      });

      renderIndex();
    })();
  </script>
</body>
</html>
